<!doctype html><html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163f37"><title>Strategi & Ledelse · Økonomilab</title><link rel="stylesheet" href="style.css?v=2"><script src="app.js?v=2" defer></script><script id="study-data" type="application/json">{"topics": [{"id": "1", "title": "Tilbud, etterspørsel og likevekt", "category": "mikro", "subtitle": "Hvordan finner markedet sin pris?", "body": "Etterspørselen viser hvor mye kjøperne ønsker å kjøpe ved ulike priser, alt annet likt. Tilbudet viser selgernes ønskede salg. Likevekt oppstår når tilbudt mengde er lik etterspurt mengde. En prisendring gir bevegelse langs kurven; endret inntekt, teknologi eller preferanser kan forskyve hele kurven.", "formula": "Qd = a − bP · Qs = c + dP · P* = (a − c)/(b + d)", "example": "Med Qd = 100 − 2P og Qs = 10 + P blir P* = 30 og Q* = 40. En økning i etterspørselen løfter både likevektspris og mengde ved stigende tilbud.", "strategy": "En bedrift må skille mellom høyere betalingsvilje og lavere produksjonskostnader når den vurderer pris og kapasitet.", "area": "mikro", "sections": [{"title": "Løsning med algebra", "text": "Sett Qd=Qs. Med Qd=100−2P og Qs=10+P får vi 90=3P og P=30. Sett P inn i begge funksjoner: begge gir Q=40. Verifisering i begge kurver fanger opp mange fortegnsfeil."}, {"title": "Bevegelse eller forskyvning?", "text": "En endring i varens egen pris gir en bevegelse langs en kurve. En inntektsøkning som øker etterspørselen ved hver pris flytter etterspørselskurven mot høyre. Ikke beskriv en prisøkning alene som økt tilbudskurve."}]}, {"id": "2", "title": "Priselastisitet", "category": "mikro", "subtitle": "Hvor følsomme er kundene for pris?", "body": "Priselastisitet måler prosentvis mengdeendring relativt til prosentvis prisendring. Etterspørselen er elastisk når absoluttverdien er større enn 1 og uelastisk når den er mindre enn 1. Tilgang på substitutter, tid og budsjettandel påvirker følsomheten.", "formula": "ε = (% endring i Q) / (% endring i P)", "example": "Når prisen øker 10 % og mengden faller 20 %, er elastisiteten omtrent −2. Med elastisk etterspørsel faller salgsinntekten ved en liten prisøkning, alt annet likt.", "strategy": "Elastisitet hjelper med prisvalg, men høyere omsetning er ikke nødvendigvis høyere overskudd.", "area": "mikro", "sections": [{"title": "Punktelastisitet", "text": "For en deriverbar etterspørselsfunksjon er ε=(dQ/dP)·P/Q. Med Q=100−2P, P=30 og Q=40 får vi ε=−2·30/40=−1,5. Elastisiteten varierer langs en rett etterspørselskurve selv om helningen er konstant."}, {"title": "Midtpunktsmetoden", "text": "For større diskrete endringer kan buelastisitet beregnes som (ΔQ/gjennomsnittlig Q)/(ΔP/gjennomsnittlig P). Da blir målet likt uansett hvilken retning mellom de to punktene som brukes."}]}, {"id": "3", "title": "Kostnader og marginalanalyse", "category": "mikro", "subtitle": "Ta beslutninger på marginen.", "body": "Faste kostnader endres ikke med produksjonen på kort sikt. Variable kostnader øker med aktiviteten. Marginalkostnaden er kostnaden ved én ekstra enhet. En indre profittmaksimerende løsning krever normalt marginalinntekt lik marginalkostnad, med relevante andreordens- og deltakelsesvilkår.", "formula": "π = TR − TC · MC = ΔTC/ΔQ · MR = ΔTR/ΔQ", "example": "En ekstra enhet gir 150 kr i inntekt og koster 110 kr å produsere. Den øker overskuddet med 40 kr så lenge andre virkninger ikke endrer regnestykket.", "strategy": "Allerede påløpte irreversible kostnader skal ikke styre fremtidige valg. Alternativkostnaden må derimot tas med.", "area": "mikro", "sections": [{"title": "Profitt mot omsetning", "text": "Profitt er inntekt minus relevante kostnader. Økt omsetning kan redusere profitt hvis økt volum gir høyere marginalkostnad enn marginalinntekt."}, {"title": "Nedstenging på kort sikt", "text": "For en pristaker med uunngåelige faste kostnader er kortsiktig produksjon aktuelt når prisen minst dekker gjennomsnittlig variabel kostnad ved optimal mengde. Langsiktig exit må også vurdere unngåelige faste kostnader og alternativ bruk av ressurser."}]}, {"id": "4", "title": "Markedsformer og markedsmakt", "category": "mikro", "subtitle": "Fra pristaker til prissetter.", "body": "Ved fullkommen konkurranse er bedriften pristaker. En monopolist møter hele markedets etterspørsel og velger normalt mengde der MR = MC, før prisen leses av etterspørselskurven. Oligopol innebærer at få aktører må ta hensyn til hverandres handlinger.", "formula": "Konkurranse: P = MC · Monopol: MR = MC", "example": "Med fallende etterspørsel må en monopolist normalt redusere pris for å selge mer. Marginalinntekten ligger derfor under prisen ved en enhetlig pris.", "strategy": "Etableringsbarrierer og substitutter påvirker hvor varig en konkurransefordel kan bli.", "area": "mikro", "sections": [{"title": "Modellvalg", "text": "Konkurranse i pris eller mengde, produktdifferensiering, kapasitet og tidspunkt for handlingene påvirker resultatene. Et duopol alene er ikke nok til å bestemme hvilken modell som passer."}, {"title": "Prispåslag", "text": "For en indre enhetsprisende monopolist kan Lerner-indeksen skrives (P−MC)/P=−1/ε under standardvilkår. ε må være etterspørselselastisiteten bedriften står overfor, ikke ukritisk et samlet bransjeanslag."}]}, {"id": "5", "title": "Spillteori og strategiske valg", "category": "mikro", "subtitle": "Når resultatet avhenger av andre.", "body": "Et spill beskrives med aktører, strategier og gevinster. I en Nash-likevekt kan ingen aktør forbedre sitt eget utfall ved å endre strategi alene. En dominant strategi er best uavhengig av hva andre velger. En likevekt trenger ikke være kollektivt optimal.", "formula": "Nash: ingen lønnsom ensidig avvikelse", "example": "To bedrifter kan ende i priskrig selv om begge ville tjent mer med høyere priser. Gjentatte spill og observerbar atferd kan endre insentivene.", "strategy": "Kartlegg motpartens insentiver før du vurderer en respons på pris, kapasitet eller markedsetablering.", "area": "spill", "sections": [{"title": "Fra oversikt til metode", "text": "Start med Spillets byggesteiner, deretter Beste respons og Nash-likevekt i rene strategier. Bruk spillverkstedet til å markere alle rene likevekter og se beste-respons-markeringene."}, {"title": "Videre fordypning", "text": "Blandede strategier, sekvensielle spill, gjentatte spill, Cournot, Bertrand og Stackelberg er ulike utvidelser. Identifiser timing og informasjon før du velger løsningsmetode."}]}, {"id": "6", "title": "Eksternaliteter og markedssvikt", "category": "mikro", "subtitle": "Når markedet ikke fanger alle kostnader.", "body": "En eksternalitet er en virkning på andre som ikke fullt ut inngår i prisen. Ved en negativ produksjonseksternalitet overstiger samfunnets marginalkostnad bedriftens private marginalkostnad. Uregulert produksjon kan da bli for høy. Offentlige goder er ikke-rivaliserende og ikke-ekskluderbare.", "formula": "MSC = MPC + marginal ekstern kostnad", "example": "En fabrikk betaler egne produksjonskostnader, mens naboene bærer forurensningsskader. En korrekt utformet avgift kan gjøre utslippskostnaden relevant for bedriftens valg.", "strategy": "Regulering, avgifter og utslippskvoter endrer både kostnader og muligheter for innovasjon.", "area": "mikro", "sections": [{"title": "Korrigerende avgift", "text": "En Pigou-avgift settes i den enkle modellen lik marginal ekstern skade ved samfunnsoptimalt aktivitetsnivå. Det krever informasjon om skade og kostnader; en vilkårlig avgift er ikke nødvendigvis optimal."}, {"title": "Andre markedssvikter", "text": "Markedsmakt, asymmetrisk informasjon og offentlige goder kan også hindre effektiv ressursbruk. Identifiser mekanismen før du foreslår tiltak."}]}, {"id": "7", "title": "BNP og nasjonalregnskap", "category": "makro", "subtitle": "Mål verdiskapingen i økonomien.", "body": "Bruttonasjonalprodukt måler verdien av endelige varer og tjenester produsert innenlands i en periode. Utgiftsmetoden summerer konsum, bruttoinvesteringer, offentlig konsum og investeringer samt nettoeksport. Reelt BNP korrigerer for prisendringer; nominelt BNP bruker løpende priser.", "formula": "Y = C + I + G + X − M", "example": "Med C = 600, I = 150, G = 200, X = 100 og M = 80 er BNP 970. Import trekkes fra fordi den allerede kan inngå i de øvrige utgiftspostene.", "strategy": "BNP-vekst sier noe om etterspørselen, men måler ikke fordeling, ubetalt arbeid eller alle miljøvirkninger.", "area": "makro", "sections": [{"title": "Verdiskaping uten dobbelttelling", "text": "BNP kan også finnes som summen av bruttoprodukt: produksjonsverdi minus produktinnsats. Ikke summer salgsverdier i alle ledd uten å trekke fra mellomprodukter."}, {"title": "Lager og investeringer", "text": "Lagerendringer inngår i investeringene. Finansielle kjøp av aksjer er ikke i seg selv realinvesteringer i nasjonalregnskapet."}]}, {"id": "8", "title": "Inflasjon og realrente", "category": "makro", "subtitle": "Skill prisvekst fra kjøpekraft.", "body": "Inflasjon er vekst i det generelle prisnivået. Lavere inflasjon betyr at prisene stiger saktere, ikke nødvendigvis at de faller. Realrenten korrigerer den nominelle renten for inflasjon; forventet realrente bruker forventet inflasjon.", "formula": "r ≈ i − π · eksakt: 1 + r = (1 + i)/(1 + π)", "example": "Med nominell rente 5 % og inflasjon 3 % er realrenten omtrent 2 %, eller eksakt rundt 1,94 %.", "strategy": "Budsjett, lønnsforhandlinger og investeringskrav bør skille mellom nominelle og reelle størrelser.", "area": "makro", "sections": [{"title": "Forventet og realisert realrente", "text": "Investeringsvalg avhenger av forventet realrente. I ettertid kan realisert inflasjon gi en annen realrente enn den aktørene forventet da avtalen ble inngått."}, {"title": "Inflasjon og deflasjon", "text": "Desinflasjon er fallende positiv prisvekst. Deflasjon er negativ vekst i det generelle prisnivået. En enkelt vare kan bli billigere uten at økonomien har deflasjon."}]}, {"id": "9", "title": "Pengepolitikk og styringsrente", "category": "makro", "subtitle": "Hvordan virker en renteendring?", "body": "Sentralbankens styringsrente påvirker markedsrenter, kreditt, valutakurs og forventninger. Høyere rente demper normalt konsum og investeringer og kan styrke valutaen. Virkningene kommer med etterslep og avhenger av situasjonen.", "formula": "Høyere rente → normalt lavere samlet etterspørsel → dempet prispress", "example": "En bedrift med flytende lånerente får økte finansieringskostnader. Samtidig kan kundene utsette rentefølsomme kjøp.", "strategy": "Test investeringer mot flere rentebaner; samme renteendring kan ramme ulike bransjer svært forskjellig.", "area": "makro", "sections": [{"title": "Transmisjonskanaler", "text": "Høyere renter påvirker blant annet lånekostnader, sparing, formuespriser, valutakurs og forventninger. Styrken avhenger av husholdningenes og bedriftenes balanse, rentebinding og internasjonale forhold."}, {"title": "Ingen mekanisk valutakursregel", "text": "En renteøkning kan styrke valutaen, men kursen reagerer på nyheter relativt til forventninger og på mange andre forhold. Et faktisk valutakursfall etter en renteøkning motbeviser ikke alene renteeffekten alt annet likt."}]}, {"id": "10", "title": "Finanspolitikk og multiplikator", "category": "makro", "subtitle": "Offentlige budsjetter påvirker aktiviteten.", "body": "Finanspolitikk bruker offentlige utgifter og skatter. Ekspansiv politikk kan øke samlet etterspørsel ved ledig kapasitet. Automatiske stabilisatorer, som skatt og dagpenger, demper svingninger uten nye vedtak. Multiplikatoren avhenger blant annet av import, skatt, kapasitet og pengepolitikk.", "formula": "Enkel lukket modell uten skatt: k = 1/(1 − c)", "example": "Med marginal konsumtilbøyelighet c = 0,75 gir den enkle modellen k = 4. En utgiftsøkning på 10 gir modellert inntektsøkning på 40. Dette er ikke et generelt empirisk anslag.", "strategy": "Skill mellom en pedagogisk modell og et realistisk scenario med kapasitetsgrenser og politiske reaksjoner.", "area": "makro", "sections": [{"title": "Skatt og import reduserer den enkle multiplikatoren", "text": "Med proporsjonal skatt t og marginal importtilbøyelighet m i en enkel etterspørselsmodell er k=1/[1−c(1−t)+m]. Med c=0,8, t=0,25 og m=0,1 blir k=2."}, {"title": "Kapasitet og reaksjoner", "text": "Når økonomien er nær kapasitetsgrensen kan økt etterspørsel gi mer prispress og renteøkning. Da passer den enkle modellen med faste priser og uendret rente dårligere."}]}, {"id": "11", "title": "Arbeidsledighet og konjunkturer", "category": "makro", "subtitle": "Forstå svingningene i aktivitet.", "body": "Konjunkturledighet følger svak samlet etterspørsel. Friksjonsledighet oppstår ved søk og jobbskifter. Strukturledighet skyldes blant annet manglende samsvar mellom kompetanse, geografi og tilgjengelige jobber. Produksjonsgapet er forskjellen mellom faktisk og anslått potensiell produksjon.", "formula": "Ledighetsrate = arbeidsledige / arbeidsstyrken × 100 %", "example": "Med 50 ledige og 950 sysselsatte er arbeidsstyrken 1000 og ledigheten 5 %. Personer utenfor arbeidsstyrken inngår ikke i nevneren.", "strategy": "Rekruttering og kapasitet må vurderes ut fra både konjunkturer og tilgang på relevant kompetanse.", "area": "makro", "sections": [{"title": "Arbeidsstyrken", "text": "Arbeidsstyrken består av sysselsatte og arbeidsledige etter definisjonen som brukes. En person uten arbeid kan være utenfor arbeidsstyrken dersom vedkommende ikke søker eller ikke er tilgjengelig."}, {"title": "Produksjonsgap", "text": "Et negativt produksjonsgap indikerer aktivitet under anslått potensial. Potensialet er ikke direkte observerbart, så gapet er et usikkert modellanslag."}]}, {"id": "12", "title": "Valutakurs og internasjonal handel", "category": "makro", "subtitle": "En åpen økonomi møter verden.", "body": "En svekkelse av kronen betyr at utenlandsk valuta blir dyrere målt i kroner. Det øker normalt importprisene og kan bedre konkurranseevnen for eksportører. Nettoeffekten avhenger av importinnhold, kontrakter, etterspørsel og sikring. Komparative fortrinn bygger på relativ alternativkostnad.", "formula": "Fra 10 til 11 NOK/EUR: euroen koster 10 % mer i NOK", "example": "En import på 100 euro øker fra 1000 til 1100 kroner før andre kostnader. En eksportør med euroinntekt får også flere kroner, men kan ha dyrere importerte innsatsvarer.", "strategy": "Kartlegg både inntekter, kostnader og gjeld i valuta før du vurderer valutarisiko.", "area": "makro", "sections": [{"title": "Sitatretningen betyr noe", "text": "NOK/EUR angir kroner per euro. Fra 10 til 11 stiger prisen på euro med 10 %. Kronens verdi i euro faller fra 0,1 til 1/11, en nedgang på omtrent 9,09 %."}, {"title": "Reell konkurranseevne", "text": "Nominell svekkelse kan motvirkes av høyere innenlandske priser og kostnader. Reell valutakurs tar hensyn til relative prisnivåer, men fortegnsretningen avhenger av definisjonen."}]}, {"id": "g1", "title": "Spillets byggesteiner og gevinstmatriser", "subtitle": "Aktører, strategier, informasjon og gevinster.", "body": "Et strategisk spill oppstår når ditt beste valg avhenger av hva andre velger. Beskriv først aktørene, hvilke strategier hver av dem har, tidspunktet for valgene og hvilken informasjon de har. Gevinster uttrykker aktørenes preferanser for utfall; de kan være overskudd, nytte eller andre sammenlignbare størrelser for den enkelte aktør.", "formula": "G = (N, (Sᵢ), (uᵢ)) · Gevinst i en celle: (radspiller, kolonnespiller)", "example": "To bedrifter velger høy eller lav pris samtidig. Cellen (Høy, Lav) med gevinst (1, 5) betyr at radbedriften tjener 1, mens kolonnebedriften tjener 5. Det betyr ikke at begge bedriftene får 5.", "strategy": "Før en strategisk analyse må du velge hvem som faktisk påvirker utfallet, og hvilke alternativer de har.", "sections": [{"title": "Slik leser du en matrise", "text": "Radspillerens alternativer står til venstre; kolonnespillerens står øverst. I hvert ordnet par er det første tallet radspillerens gevinst og det andre kolonnespillerens. Sammenlign alltid samme aktørs gevinster. Tall på tvers av aktører kan bare summeres meningsfullt når skalaene er sammenlignbare, som overskudd i samme valuta."}, {"title": "Handling eller strategi?", "text": "I et engangs simultant spill kan en strategi være ett valg. I et sekvensielt spill er en ren strategi en fullstendig handlingsplan for alle situasjoner der aktøren kan bli bedt om å velge, også situasjoner som ikke nås i likevekten."}, {"title": "Modellens grenser", "text": "Simultan betyr at man velger uten å observere den andres aktuelle valg; valgene trenger ikke skje på nøyaktig samme klokkeslett. Ikke bland sammen simultane valg og ufullstendig informasjon om typer eller kostnader."}], "area": "spill", "category": "mikro"}, {"id": "g2", "title": "Beste respons – finn ett valg av gangen", "subtitle": "Lær metoden før du leter etter Nash-likevekt.", "body": "En beste respons maksimerer en aktørs gevinst gitt motpartens strategi. Hold motpartens valg fast mens du sammenligner dine egne alternativer. Ved lik gevinst kan flere strategier være beste responser. Beste respons er derfor en korrespondanse, ikke alltid en funksjon med ett svar.", "formula": "BRᵢ(s₋ᵢ) = arg max over sᵢ av uᵢ(sᵢ, s₋ᵢ)", "example": "Anta at kolonnen velger Venstre. Rad får 4 ved Øverst og 2 ved Nederst; Øverst er beste respons. Hvis kolonnen velger Høyre og rad får 1 ved Øverst og 3 ved Nederst, er Nederst beste respons mot Høyre.", "strategy": "En respons på en konkurrent må vurderes gitt konkurrentens konkrete handling, ikke ut fra største tall i hele matrisen.", "sections": [{"title": "Radspillerens metode", "text": "Gå kolonne for kolonne. I én fast kolonne sammenligner du de første tallene vertikalt. Marker alle maksimum. Bytt så til neste kolonne."}, {"title": "Kolonnespillerens metode", "text": "Gå rad for rad. I én fast rad sammenligner du de andre tallene horisontalt. Marker alle maksimum. Det er en vanlig feil å sammenligne kolonnens gevinster vertikalt."}, {"title": "Kontroll av avvik", "text": "En ensidig avvikelse flytter bare én aktør om gangen. Når rad bytter strategi, forblir kolonnen den samme. Når kolonne bytter, forblir raden den samme."}], "area": "spill", "category": "mikro"}, {"id": "g3", "title": "Nash-likevekt i rene strategier", "subtitle": "Finn skjæringspunktene mellom beste responser.", "body": "En strategiprofil er en Nash-likevekt når hver aktørs strategi er en beste respons på de andres strategier. Ingen kan øke sin egen gevinst ved å endre strategi alene. Nash er en stabilitetsbetingelse gitt valgene til de andre, ikke en garanti for rettferdighet, samarbeid eller høyest samlet gevinst.", "formula": "uᵢ(sᵢ*, s₋ᵢ*) ≥ uᵢ(sᵢ, s₋ᵢ*) for alle i og alle sᵢ", "example": "I fangens dilemma med (S,S)=(3,3), (S,A)=(0,5), (A,S)=(5,0), (A,A)=(1,1), er (A,A) Nash. Ved (A,A) får en avviker 0 i stedet for 1. (S,S) er ikke Nash fordi hver kan få 5 ved å avvike alene.", "strategy": "Bruk Nash til å teste om et foreslått strategisk utfall tåler at én part revurderer valget sitt.", "sections": [{"title": "En oppskrift i fire trinn", "text": "1: Les hvem som får hvilket tall. 2: Finn radspillerens beste respons i hver kolonne. 3: Finn kolonnespillerens beste respons i hver rad. 4: Celler med begge markeringer er rene Nash-likevekter. Sjekk alle celler; det kan være flere likevekter."}, {"title": "Svake ulikheter og like gevinster", "text": "Et avvik med samme gevinst bryter ikke Nash-betingelsen. Det må finnes et strengt lønnsomt ensidig avvik for å avvise en kandidat. Derfor må alle like gode beste responser markeres."}, {"title": "Hva hvis ingen celle kvalifiserer?", "text": "Konkluder at spillet ikke har noen Nash-likevekt i rene strategier. Ikke konkluder at det ikke har noen Nash-likevekt overhodet. Et endelig spill har minst én likevekt når blandede strategier tillates."}], "area": "spill", "category": "mikro"}, {"id": "g4", "title": "Dominante og dominerte strategier", "subtitle": "Et sterkere krav enn beste respons.", "body": "En strengt dominant strategi gir høyere gevinst enn alle egne alternativer for hvert mulig valg fra motparten. En strengt dominert strategi gir lavere gevinst enn en annen egen strategi i alle disse tilfellene. Svak dominans krever minst like høy gevinst overalt og strengt høyere gevinst i minst ett tilfelle.", "formula": "Streng dominans: uᵢ(a,s₋ᵢ) > uᵢ(b,s₋ᵢ) for alle s₋ᵢ", "example": "Rad får (4,3) ved Øverst og (2,1) ved Nederst, der tallene her er rads gevinster mot henholdsvis Venstre og Høyre. Øverst gir 4>2 og 3>1 og dominerer derfor Nederst strengt.", "strategy": "Se først etter alternativer som aldri er lønnsomme. De kan forenkle en stor strategisk analyse.", "sections": [{"title": "Dominans mot Nash", "text": "En dominant strategi er best uavhengig av motpartens valg. En Nash-strategi trenger bare være best mot motpartens likevektsvalg. Et spill kan ha Nash-likevekt selv om ingen har en dominant strategi."}, {"title": "Iterert eliminering", "text": "Fjern en strengt dominert strategi, vurder det reduserte spillet og gjenta. Strengt dominerte strategier kan ikke ha positiv sannsynlighet i en Nash-likevekt. Elimineringen kan gjøre nye strategier dominerte."}, {"title": "Forsiktig med svak dominans", "text": "Eliminering av svakt dominerte strategier kan fjerne Nash-likevekter og utfallet kan avhenge av rekkefølgen. Ikke bruk svak eliminering som om den alltid bevarer alle likevektene."}], "area": "spill", "category": "mikro"}, {"id": "g5", "title": "Fangens dilemma og kollektiv handling", "subtitle": "Individuelle insentiver kan gi et dårlig felles utfall.", "body": "I fangens dilemma dominerer avvik samarbeid for begge, mens gjensidig samarbeid er bedre for begge enn gjensidig avvik. Konflikten ligger mellom den enkeltes insentiv ved et gitt motpartsvalg og det kollektive resultatet. Den unike Nash-likevekten i engangsspillet er gjensidig avvik.", "formula": "T > R > P > S · Fristelse > samarbeid > gjensidig avvik > utnyttet samarbeid", "example": "Med T=5, R=3, P=1 og S=0 får begge 1 i likevekten, selv om begge kunne fått 3 ved samarbeid. (3,3) Pareto-dominerer (1,1).", "strategy": "Bruk modellen på fellesgoder, kunnskapsdeling og miljøtiltak. Endre insentiver, observasjon eller samhandlingsstruktur før du forventer et annet resultat.", "sections": [{"title": "Hvorfor samarbeid ikke er Nash", "text": "Hvis den andre samarbeider, gir avvik 5 i stedet for 3. Hvis den andre avviker, gir avvik 1 i stedet for 0. Det samme gjelder begge aktører."}, {"title": "Hva modellen ikke sier", "text": "Modellen beviser ikke at mennesker alltid er egoistiske. Dersom aktører verdsetter normer, omdømme eller andres utfall, må dette inn i gevinstene. Da kan det være et annet spill."}, {"title": "En ledelsesimplikasjon", "text": "Bonusordninger som belønner intern konkurranse kan skape et dilemma for avdelingene. Felles resultatmål eller gjentatt samhandling kan endre insentivene. Analysen alene rettferdiggjør ikke konkurransebegrensende samarbeid mellom foretak."}], "area": "spill", "category": "mikro"}, {"id": "g6", "title": "Koordineringsspill og multiple likevekter", "subtitle": "Når problemet er å velge samme standard.", "body": "I et koordineringsspill foretrekker aktørene ofte å tilpasse seg hverandre. Det kan finnes flere rene Nash-likevekter. Likevektsanalysen alene avgjør da ikke hvilken som velges. Kommunikasjon, forventninger, historie og fokuspunkter kan påvirke koordineringen.", "formula": "Nash-likevekt kan være flertydig: (A,A) og (B,B)", "example": "Ved (A,A)=(4,4), (A,B)=(0,0), (B,A)=(0,0), (B,B)=(2,2) er begge diagonalene Nash. Ingen vil alene bytte bort fra en koordinert løsning. (A,A) gir høyere gevinst til begge.", "strategy": "Standardisering, teknologivalg og organisasjonsrutiner kan kreve koordinering selv når alle kjenner det beste felles utfallet.", "sections": [{"title": "Pareto-rangering", "text": "At én likevekt Pareto-dominerer en annen innebærer ikke automatisk at den blir valgt. Forventninger kan gjøre det rasjonelt å velge et lavere lønnet koordinert alternativ."}, {"title": "Koordineringskonflikt", "text": "I Battle of the Sexes ønsker begge å koordinere, men de foretrekker ulike koordinerte utfall. Det finnes både et koordineringsproblem og en fordelingskonflikt."}, {"title": "Blandet likevekt", "text": "Mange 2×2-koordineringsspill har også en indre blandet likevekt. Blandingssannsynlighetene finnes ved å gjøre motparten indifferent, ikke ved å maksimere egen gevinst med sin egen sannsynlighet."}], "area": "spill", "category": "mikro"}, {"id": "g7", "title": "Hauk–due og Chicken", "subtitle": "Når det lønner seg å gjøre det motsatte.", "body": "I et anti-koordineringsspill vil én aktør gjerne stå hardt på sitt dersom den andre gir etter, men gi etter dersom den andre står hardt. Kollisjon kan være kostbar for begge. Typiske Chicken-spill har to asymmetriske rene Nash-likevekter og én blandet.", "formula": "Beste respons mot Hard er Myk; mot Myk er Hard", "example": "La (Hard,Hard)=(-2,-2), (Hard,Myk)=(4,0), (Myk,Hard)=(0,4), (Myk,Myk)=(2,2). (Hard,Myk) og (Myk,Hard) er rene Nash-likevekter; (Myk,Myk) er ikke, siden en aktør kan øke fra 2 til 4.", "strategy": "Forhandlinger og kapasitetskonflikter kan gi insentiver til å fremstå kompromissløs, men en modellert forpliktelse kan også øke faren for kostbar konflikt.", "sections": [{"title": "Forskjell fra fangens dilemma", "text": "I Chicken har ingen en strengt dominant strategi i den oppgitte matrisen. Den beste responsen avhenger av hva den andre gjør. I fangens dilemma er avvik strengt dominant."}, {"title": "Etterprøv begge asymmetrier", "text": "Ved (Hard,Myk) taper rad på å bli myk: 2\u003c4. Kolonne taper på å bli hard: −2\u003c0. Begge er dermed beste responser."}, {"title": "Blandet løsning", "text": "Hvis motparten spiller Hard med sannsynlighet q, gir Hard forventet gevinst 4−6q, mens Myk gir 2−2q. Indifferens gir q=1/2. Ved symmetri blander begge med 1/2."}], "area": "spill", "category": "mikro"}, {"id": "g8", "title": "Pareto-effektivitet og samlet gevinst", "subtitle": "Skill individuell stabilitet fra felles forbedring.", "body": "Et utfall Pareto-dominerer et annet hvis minst én aktør får det bedre uten at noen får det verre. Et Pareto-effektivt utfall har ingen mulig Pareto-forbedring i det relevante utfallsrommet. Begrepet sier ikke om fordelingen er rettferdig. Nash og Pareto svarer på forskjellige spørsmål.", "formula": "Pareto-forbedring: alle minst like bra, minst én strengt bedre", "example": "(3,3) Pareto-dominerer (1,1). Derimot kan ikke (5,0) og (3,3) rangeres ved Pareto-kriteriet: den ene vinner og den andre taper. En høyere sum er ikke alene en Pareto-forbedring.", "strategy": "Evaluer både om en avtale er stabil, og om den gir forbedringer for berørte parter. Overføringer kan endre hva som er mulig.", "sections": [{"title": "Avgrens utfallsrommet", "text": "Hvis bare rene celler vurderes, skriv det. Hvis lotterier eller pengeoverføringer er mulige, kan effektivitetsvurderingen endres. Oppgavene med matriser vurderer de viste rene utfallene."}, {"title": "Summering krever enhet", "text": "Når begge tall er overskudd i samme valuta, kan samlet overskudd summeres direkte. Vilkårlige nytteindekser er ikke uten videre sammenlignbare mellom personer."}, {"title": "En vanlig eksamensfeil", "text": "En celle med høyest sum er ikke nødvendigvis Nash, og en Nash-celle trenger ikke ha høyest sum. Kontroller ensidige avvik og Pareto-forbedringer hver for seg."}], "area": "spill", "category": "mikro"}, {"id": "g9", "title": "Blandede strategier og forventet gevinst", "subtitle": "Tilfeldiggjøring som strategisk valg.", "body": "En blandet strategi er en sannsynlighetsfordeling over en aktørs rene strategier. I en blandet Nash-likevekt maksimerer hver aktør forventet gevinst gitt motpartens fordeling. Alle rene strategier som brukes med positiv sannsynlighet må gi samme forventede gevinst, og utelatte strategier må ikke gi høyere gevinst.", "formula": "E[u(A)] = q·u(A,V) + (1−q)·u(A,H)", "example": "Rad får 4 mot Venstre og 0 mot Høyre ved Øverst. Hvis kolonne velger Venstre med q=0,25, er forventet gevinst av Øverst 0,25·4 + 0,75·0 = 1.", "strategy": "Uforutsigbarhet kan være verdifull i konkurranse eller kontroll, men tilfeldighet i en modell er ikke det samme som planløs ledelse.", "sections": [{"title": "Hva er tilfeldig?", "text": "Aktøren velger en fordeling og trekker en handling fra den. Motparten kjenner fordelingen i likevektsmodellen, men ikke realisasjonen før egne valg."}, {"title": "Støtte og indifferens", "text": "Hvis Øverst gir strengt mer enn Nederst mot kolonnens fordeling, vil rad aldri ønske å spille Nederst med positiv sannsynlighet. Indifferens er derfor nødvendig for en indre blanding."}, {"title": "Eksistens", "text": "Nashs eksistensresultat gjelder endelige spill med blandede strategier. Det sier ikke at likevekten er unik eller at alle aktører blander i enhver likevekt."}], "area": "spill", "category": "mikro"}, {"id": "g10", "title": "Regn ut en blandet Nash-likevekt", "subtitle": "Finn motpartens sannsynlighet ved indifferens.", "body": "La p være sannsynligheten for at rad velger Øverst og q sannsynligheten for at kolonne velger Venstre. Finn q ved å sette rads forventede gevinster fra Øverst og Nederst like. Finn p ved å sette kolonnes forventede gevinster fra Venstre og Høyre like. Kontroller at begge sannsynligheter ligger mellom 0 og 1.", "formula": "q·a+(1−q)·b = q·c+(1−q)·d", "example": "Matrisen er (Ø,V)=(3,2), (Ø,H)=(0,0), (N,V)=(0,0), (N,H)=(2,3). Rad er indifferent når 3q=2(1−q), altså q=2/5. Kolonne er indifferent når 2p=3(1−p), altså p=3/5.", "strategy": "Etterspør alltid hvem en beregnet sannsynlighet tilhører. Indifferenslikningen for rad bestemmer kolonnes blanding.", "sections": [{"title": "Sjekk løsningen", "text": "Ved q=0,4 gir begge radvalg 1,2. Ved p=0,6 gir begge kolonnevalg 1,2. Dermed ønsker ingen å endre sin egen fordeling ensidig."}, {"title": "Ikke alle spill har en indre blanding", "text": "En algebraisk løsning utenfor [0,1] er ikke en gyldig blandet strategi. Ved degenererte likninger kan det finnes mange blandinger eller ingen indre løsning. Sjekk rene likevekter og eventuelle randløsninger."}, {"title": "Større spill", "text": "I større spill kan du prøve en kandidat til støtte, gjøre strategiene i støtten like gode og så sjekke at utelatte strategier ikke er bedre. Bare indifferens innen støtten er ikke tilstrekkelig."}], "area": "spill", "category": "mikro"}, {"id": "g11", "title": "Matching pennies og nullsumspill", "subtitle": "Et spill uten ren likevekt.", "body": "I matching pennies ønsker rad like sider og kolonne ulike sider. Hver gevinst for én er et tilsvarende tap for den andre, så spillet er nullsum. Ingen ren celle er stabil: én aktør vil alltid bytte. Den unike blandede likevekten i standardversjonen er at begge velger hver side med sannsynlighet 1/2.", "formula": "u₁ + u₂ = 0 · p*=q*=1/2 · forventet gevinst = 0", "example": "Diagonalene gir (1,−1), mens cellene utenfor diagonalen gir (−1,1). Hvis rad alltid velger Krone, velger kolonne Mynt. Hvis rad da bytter til Mynt, vil kolonne ønske å bytte til Krone.", "strategy": "Bruk nullsummodellen bare når interessene faktisk er helt motsatte. Mange forhandlinger og markeder har både felles og motstridende interesser.", "sections": [{"title": "Utled blandingen", "text": "Rad får 2q−1 ved Krone og 1−2q ved Mynt. Sett dem like: 4q=2 og q=1/2. Tilsvarende gjør p=1/2 kolonne indifferent."}, {"title": "Minimax-intuisjon", "text": "I endelige tospiller-nullsumspill sammenfaller Nash- og minimax-løsningene. En optimal strategi sikrer spillverdien mot alle motpartsvalg i forventning."}, {"title": "En fallgruve", "text": "At ingen rene Nash-likevekter finnes betyr ikke at alle handlinger er like gode. Mot en skjev blanding vil én ren respons normalt være best."}], "area": "spill", "category": "mikro"}, {"id": "g12", "title": "Sekvensielle spill og spilltrær", "subtitle": "Strategi er en fullstendig handlingsplan.", "body": "I sekvensielle spill velger aktørene i en rekkefølge. Et spilltre viser beslutningsnoder, mulige handlinger og gevinster i sluttpunktene. Ved perfekt informasjon ser aktøren alle tidligere handlinger når den velger. Dette er forskjellig fra fullstendig informasjon om gevinster og typer.", "formula": "Strategi = handling ved hvert eget beslutningspunkt", "example": "En nykommer velger Inn eller Ute. Den etablerte velger Hard eller Myk dersom nykommeren går inn. Nykommerens strategi har to valg; den etablerte må angi hva den vil gjøre etter Inn, også om utfallet blir Ute.", "strategy": "Investeringsrekkefølge, timing og muligheten til å observere valg kan endre konkurranseutfallet.", "sections": [{"title": "Informasjonssett", "text": "Noder i samme informasjonssett kan ikke skilles av aktøren som skal velge. En strategi må angi samme handling for noder i samme informasjonssett."}, {"title": "Hva er et delspill?", "text": "Et delspill starter i en node som er alene i sitt informasjonssett og inneholder alle etterfølgende noder uten å kutte et informasjonssett."}, {"title": "Handling er ikke strategi", "text": "Hvis en aktør kan velge etter to forskjellige observerte historiesekvenser, må strategien spesifisere hva den gjør etter begge, ikke bare langs den realiserte banen."}], "area": "spill", "category": "mikro"}, {"id": "g13", "title": "Baklengs induksjon og delspillperfeksjon", "subtitle": "Sjekk om truslene er troverdige.", "body": "Baklengs induksjon løser et endelig spill med perfekt informasjon fra siste beslutning og bakover. En delspillperfekt Nash-likevekt er Nash i hvert delspill. Den utelukker Nash-likevekter som bygger på ikke-troverdige planer i delspill utenfor likevektsbanen.", "formula": "Delspillperfekt likevekt ⇒ Nash-likevekt", "example": "Nykommer velger Ute med gevinst (0,4), eller Inn. Etter Inn gir Hard (−1,1) og Myk (2,2). Den etablerte velger Myk fordi 2>1. Nykommeren velger derfor Inn fordi 2>0. Utfallet er (Inn,Myk).", "strategy": "En trussel om priskrig er bare troverdig dersom det fortsatt er lønnsomt å gjennomføre den når tidspunktet kommer.", "sections": [{"title": "Hvorfor et annet Nash kan finnes", "text": "Profilen (Ute,Hard) er Nash i normalformen: gitt Hard vil nykommeren holde seg ute, og når Ute velges påvirker ikke den etablertes plan gevinstene. Men Hard er ikke optimalt i delspillet etter Inn. Profilen er derfor ikke delspillperfekt."}, {"title": "Ved like gevinster", "text": "Hvis siste aktør er indifferent, kan det finnes flere optimale videreføringer og flere delspillperfekte likevekter. Ikke velg vilkårlig én gren og påstå at løsningen nødvendigvis er unik."}, {"title": "Begrensninger", "text": "Enkel baklengs induksjon passer endelige spill med perfekt informasjon. Ved ufullkommen informasjon må strategier og eventuelle oppfatninger analyseres mer nøye."}], "area": "spill", "category": "mikro"}, {"id": "g14", "title": "Forpliktelser og etableringsspill", "subtitle": "Når handlinger gjør trusler troverdige.", "body": "En strategisk forpliktelse endrer hvilke fremtidige valg som er mulige eller lønnsomme. Forpliktelsen må være observerbar og tilstrekkelig bindende for å påvirke motpartens forventninger. En ren erklæring som kan ignoreres uten kostnad endrer ikke nødvendigvis spillet.", "formula": "Troverdighet krever at planlagt handling er optimal eller bindende når den skal utføres", "example": "I etableringsspillet med Hard (−1,1) og Myk (2,2) er Hard ikke troverdig. Hvis en bindende avtale endrer den etablertes gevinst ved Myk fra 2 til 0, velges Hard etter Inn siden 1>0. Nykommeren velger da Ute.", "strategy": "Verder avtaler, kapasitet eller organisatoriske regler ved å analysere hvordan de endrer senere insentiver. En irreversibel kostnad alene gjør ikke enhver trussel troverdig.", "sections": [{"title": "Kostnaden ved forpliktelsen", "text": "Du må også sammenligne nettogevinsten før forpliktelsen gjøres. En endring som avskrekker etablering kan likevel koste mer enn den skaper i verdi."}, {"title": "Førstetrekk er ikke alltid en fordel", "text": "I noen spill gir forpliktelse en fordel, i andre er det bedre å vente og tilpasse seg. Konklusjonen må utledes fra det konkrete spillet."}, {"title": "Forhandling og institusjoner", "text": "Beslutningsregler og kontrakter kan gjøre løfter troverdige. Lovlighet, håndheving og faktisk observasjon er egne forutsetninger som modellen må gjøre eksplisitte."}], "area": "spill", "category": "mikro"}, {"id": "g15", "title": "Gjentatte spill og diskontering", "subtitle": "Fremtidige gevinster kan endre dagens valg.", "body": "Når samme aktører møtes gjentatte ganger, kan dagens handling påvirke fremtidig atferd. En diskonteringsfaktor δ mellom 0 og 1 uttrykker vekten på fremtidige gevinster. Høy δ kan gjenspeile tålmodighet og/eller høy sannsynlighet for videre samhandling. I et endelig spill med kjent slutt og unik Nash-likevekt i stadiespillet gir standard baklengs induksjon at denne likevekten spilles i alle perioder.", "formula": "V = u₀ + δu₁ + δ²u₂ + … · konstant strøm: V = u/(1−δ)", "example": "En gevinst på 3 hver periode med δ=0,8 har nåverdi 3/(1−0,8)=15. En gevinst nå på 5 kan være mindre attraktiv hvis den utløser lavere fremtidige gevinster.", "strategy": "Omdømme og langvarige relasjoner kan endre insentiver, men varighet alene garanterer ikke samarbeid.", "sections": [{"title": "Observerbarhet", "text": "En sanksjon må kunne knyttes til en observert handling eller et tilstrekkelig informativt signal. Støy kan gjøre en enkel strafferegel kostbar eller lite treffsikker."}, {"title": "Kjent sluttdato", "text": "Hvis det er kjent at spillet slutter etter T perioder, starter analysen i siste periode. Konklusjonen om gjentatt stadielikevekt krever blant annet en unik Nash-likevekt i stadiespillet og standard forutsetninger."}, {"title": "Uendelig horisont", "text": "Uendelig horisont eller usikker slutt kan åpne for samarbeid når diskonteringen er liten nok, overvåkingen tilstrekkelig og fremtidige reaksjoner troverdige."}], "area": "spill", "category": "mikro"}, {"id": "g16", "title": "Grim trigger – regn ut samarbeidsvilkåret", "subtitle": "Sammenlign samarbeid med ett avvik og varig straff.", "body": "Grim trigger innebærer samarbeid frem til første observerte avvik og deretter permanent avvik. I et uendelig gjentatt fangens dilemma med perfekt overvåking må det være minst like lønnsomt å samarbeide som å avvike én gang og motta straffegevinsten i alle senere perioder. Gjensidig avvik er troverdig straff når det er Nash i stadiespillet.", "formula": "R/(1−δ) ≥ T + δP/(1−δ) ⇔ δ ≥ (T−R)/(T−P)", "example": "Med T=5, R=3 og P=1 får vi δ≥(5−3)/(5−1)=1/2. Ved δ=0,6 er samarbeid verdt 7,5. Avvik gir 5+0,6·1/0,4=6,5. Samarbeid er da optimalt gitt strategiene.", "strategy": "Analyse av relasjonelle avtaler krever både en insentivbetingelse og en vurdering av om fremtidige reaksjoner er gjennomførbare.", "sections": [{"title": "Utledning", "text": "Multipliser ulikheten med 1−δ>0: R≥T(1−δ)+δP. Flytt ledd: δ(T−P)≥T−R. Siden T>P kan vi dele og få terskelen."}, {"title": "Hva ved likhet?", "text": "Ved δ=1/2 i eksemplet er aktøren indifferent mellom samarbeid og et enkelt avvik etter en samarbeidshistorie. Nash krever ingen strengt lønnsom avvikelse, så svak ulikhet er riktig."}, {"title": "Praktiske begrensninger", "text": "Evig straff kan være sårbar ved feilobservasjoner og kan bli utfordret av reforhandling. Formelen gjelder en bestemt strategi og modell, ikke en universell terskel for alle relasjoner."}], "area": "spill", "category": "mikro"}, {"id": "g17", "title": "Cournot: konkurranse i mengder", "subtitle": "Utled reaksjonsfunksjoner og likevekt.", "body": "I standard Cournot velger to bedrifter mengde samtidig. Markedsprisen faller når samlet mengde øker. Hver bedrift maksimerer overskudd gitt konkurrentens mengde. Reaksjonsfunksjonene er beste responser, og deres skjæring gir Nash-likevekten.", "formula": "P=a−b(q₁+q₂), MC=c · BR₁(q₂)=max{0,(a−c−bq₂)/(2b)}", "example": "La P=100−q₁−q₂ og c=10. π₁=(90−q₁−q₂)q₁. Førsteordensbetingelsen gir 90−2q₁−q₂=0. Ved symmetri er q₁=q₂=30, Q=60, P=40 og hver bedrift tjener 900.", "strategy": "Mengdekonkurranse passer bedre når kapasitet eller produksjon forpliktes før markedet klareres. Modellvalget må begrunnes.", "sections": [{"title": "Løs likningssystemet", "text": "q₁=(90−q₂)/2 og q₂=(90−q₁)/2. Symmetri gir q=(90−q)/2, altså 3q=90 og q=30. Den andrederiverte er −2, så indre kandidat maksimerer egen profitt."}, {"title": "Sammenligning", "text": "Med de samme tallene gir et monopol Q=45 og P=55. Fullkommen konkurranse gir P=10 og Q=90 ved konstante marginalkostnader. Cournot ligger mellom i dette standardtilfellet."}, {"title": "Forutsetninger", "text": "Resultatet forutsetter blant annet homogene produkter, kjente etterspørsels- og kostnadsfunksjoner, ingen kapasitetsbindinger og a>c for positiv indre produksjon."}], "area": "spill", "category": "mikro"}, {"id": "g18", "title": "Bertrand: konkurranse i pris", "subtitle": "Hvorfor to aktører kan presse pris ned til kostnad.", "body": "I standard Bertrand velger bedriftene pris samtidig for identiske produkter. Kunder kjøper fra billigste tilbyder, og bedriftene kan dekke hele etterspørselen. Med like konstante marginalkostnader, kontinuerlige priser og passende deling ved lik pris er P=c en Nash-likevekt. Dette skarpe resultatet er følsomt for modellforutsetningene.", "formula": "Homogene produkter + lik MC + ingen kapasitetsgrense ⇒ standard likevektspris P=c", "example": "Begge har MC=10 og tar pris 20. Én kan sette 19,99 og vinne hele markedet i standardmodellen. Ved felles pris 10 gir underkutting tap, mens en høyere pris mister salget til konkurrenten.", "strategy": "Differensiering, byttekostnader og kapasitetsbegrensninger kan endre priskonkurransen. Ikke overfør P=c ukritisk til alle duopoler.", "sections": [{"title": "Forskjell fra Cournot", "text": "I Cournot holdes konkurrentens mengde fast ved et ensidig avvik. I Bertrand holdes konkurrentens pris fast. Dette gir ulike etterspørselsresponser og likevekter."}, {"title": "Differensierte produkter", "text": "Hvis kundene ikke ser produktene som perfekte substitutter, vil en liten underkutting normalt ikke ta hele markedet. Positive prispåslag kan da være forenlige med Nash."}, {"title": "Diskrete priser", "text": "Med et minste prissteg kan de eksakte likevektsresultatene avvike fra standardresultatet med kontinuerlige priser. Skriv alltid antakelsen du bruker."}], "area": "spill", "category": "mikro"}, {"id": "g19", "title": "Stackelberg: lederen velger først", "subtitle": "Bruk følgerens beste respons i lederens problem.", "body": "I Stackelberg velger lederen mengde først, og følgeren observerer denne før den velger egen mengde. Lederen tar høyde for følgerens reaksjon. Under standard lineær etterspørsel og like konstante marginalkostnader velger lederen større mengde enn i Cournot og får høyere profitt.", "formula": "qL=(a−c)/(2b) · qF=(a−c)/(4b) under standardforutsetningene", "example": "Med P=100−qL−qF og c=10 svarer følgeren qF=(90−qL)/2 for relevante mengder. Lederens profitt blir (45−qL/2)qL. Maksimering gir qL=45, qF=22,5, P=32,5, πL=1012,5 og πF=506,25.", "strategy": "En observerbar og bindende kapasitetsbeslutning kan gi en førstetrekkfordel. Hvis lederen fritt kan revidere mengden, er dette en annen modell.", "sections": [{"title": "Førsteordensbetingelsen", "text": "Deriver 45qL−qL²/2 med hensyn på qL: 45−qL=0, som gir 45. Den andrederiverte er −1. Den indre løsningen gir positiv følgerproduksjon."}, {"title": "Kontroll mot Cournot", "text": "Cournot gir 30 til hver og profitt 900. Stackelberg-lederen tjener mer, mens følgeren tjener mindre i dette eksemplet."}, {"title": "Strategier i hele delspillet", "text": "For delspillperfeksjon må følgeren ha en optimal respons etter alle mulige ledervalg, også valg som ikke observeres i likevekten. Derfor trengs max{0,…} i den generelle responsen."}], "area": "spill", "category": "mikro"}, {"id": "g20", "title": "Ufullstendig informasjon og Bayesiansk Nash", "subtitle": "Strategier kan avhenge av privat informasjon.", "body": "Ved ufullstendig informasjon kjenner en aktør ikke alle relevante egenskaper ved andre, som kostnad eller betalingsvilje. Egenskapen modelleres som en type. En strategi angir handling for hver egen type. I en Bayesiansk Nash-likevekt velger hver type en handling som maksimerer forventet nytte gitt oppfatninger om andres typer og strategier.", "formula": "E[u(a)] = Σₜ Pr(t)·u(a,t), gitt informasjon og motpartens strategi", "example": "En handling gir 8 mot en lavkostnadstype og −2 mot en høykostnadstype. Hvis sannsynligheten for lav kostnad er 0,25, er forventet gevinst 0,25·8+0,75·(−2)=0,5. Dette er en forventningsberegning; en likevekt krever også motpartens optimale strategi.", "strategy": "Kartlegg hva hver part vet og hva den antar om andre. En strategi som fungerer under kjente kostnader kan slå feil med privat informasjon.", "sections": [{"title": "To ulike informasjonsbegreper", "text": "Ufullstendig informasjon gjelder blant annet ukjente typer/gevinster. Ufullkommen informasjon gjelder at tidligere handlinger ikke er fullt observert. Et simultant spill kan ha fullstendig informasjon."}, {"title": "Et terskeleksempel", "text": "Velg mellom en sikker gevinst på 1 og en usikker handling med 8 ved lav type og −2 ved høy type. Den usikre gir 10p−2. Den foretrekkes når 10p−2≥1, altså p≥0,3."}, {"title": "Sekvensielle signaler", "text": "Signalisering og screening krever at oppfatninger og insentiver analyseres sammen. Bayesiansk Nash alene utelukker ikke alle lite troverdige planer i sekvensielle spill med privat informasjon."}], "area": "spill", "category": "mikro"}, {"id": "e1", "title": "Alternativkostnad og komparative fortrinn", "subtitle": "Verdien av det beste alternativet du gir avkall på.", "body": "Alternativkostnaden er verdien av det beste tilgjengelige alternativet som ikke velges. Komparative fortrinn handler om lavere relativ alternativkostnad, selv om en aktør er mer produktiv i alt.", "formula": "Alternativkostnad for X = tapt Y / ekstra X", "example": "A kan lage 10 rapporter eller 5 analyser. B kan lage 6 rapporter eller 6 analyser. En rapport koster A 0,5 analyse og B 1 analyse; A har komparativt fortrinn i rapporter.", "strategy": "Fordel oppgaver etter relative styrker, med hensyn til koordinering og kvalitet.", "sections": [{"title": "Absolutt mot komparativt", "text": "Absolutt fortrinn betyr høyere produktivitet. Komparativt fortrinn betyr lavere alternativkostnad. Gjensidig gevinst ved spesialisering bygger på det siste."}, {"title": "Relevante kostnader", "text": "Bruk av et eid lokale er ikke gratis hvis det kunne vært leid ut. Tapt leie er en alternativkostnad selv uten en kontantutbetaling."}], "area": "mikro", "category": "mikro"}, {"id": "e2", "title": "Konsument- og produsentoverskudd", "subtitle": "Fra markedspris til samfunnsøkonomisk overskudd.", "body": "Konsumentoverskudd er forskjellen mellom betalingsvilje og faktisk betaling. Produsentoverskudd er inntekt minus variable alternativkostnader ved tilbudet, representert ved arealet over tilbudskurven og under prisen. Det er ikke generelt identisk med profitt når faste kostnader finnes.", "formula": "KO ved lineær etterspørsel = ½·(makspris−P*)·Q*", "example": "Med makspris 50, likevektspris 30 og mengde 40 er KO=0,5·20·40=400.", "strategy": "Skill mellom bedriftens overskudd og total verdiskaping for kjøpere og selgere.", "sections": [{"title": "Velferdsforutsetninger", "text": "Konkurranselikevekt maksimerer summen av KO og PO i den enkle modellen uten eksternaliteter eller andre markedssvikter. Fordeling og rettferdighet er egne spørsmål."}, {"title": "Faste kostnader", "text": "Hvis PO er 500 og relevante faste kostnader er 200, er profitt 300. Ikke bruk PO og profitt om hverandre uten å avklare kostnadene."}], "area": "mikro", "category": "mikro"}, {"id": "e3", "title": "Avgifter og skatteinsidens", "subtitle": "Hvem bærer egentlig avgiften?", "body": "En enhetsavgift skaper et gap mellom prisen kjøper betaler og prisen selger mottar. Den økonomiske byrden bestemmes av relative elastisiteter, ikke bare hvem som formelt betaler inn avgiften. Den minst elastiske siden bærer normalt størst andel.", "formula": "Pk−Ps=t · dødvektstap ved lineære kurver = ½·t·(Q₀−Q₁)", "example": "Qd=100−2Pk og Qs=10+Ps. Med t=6 får vi Pk=32, Ps=26 og Q=36. Før avgift var P=30 og Q=40. Kjøper bærer 2 og selger 4 per enhet; skatteinntekten er 216.", "strategy": "Vurder avgifters effekt på marginer, volum og kundeadferd hver for seg.", "sections": [{"title": "Slik løser du", "text": "Sett Pk=Ps+t inn i etterspørselen. Løs 100−2(Ps+6)=10+Ps, som gir Ps=26. Deretter Pk=32 og Q=36."}, {"title": "Effektivitet og eksternaliteter", "text": "Dødvektstapet ½·6·4=12 gjelder modellen uten eksternaliteter. En korrigerende avgift kan tvert imot øke velferden når den reduserer en negativ eksternalitet."}], "area": "mikro", "category": "mikro"}, {"id": "e4", "title": "Monopolprising med lineær etterspørsel", "subtitle": "Utled pris og mengde fra profitt.", "body": "En monopolist tar hensyn til hvordan salgsprisen endres når mengden øker. Med invers etterspørsel P=a−bQ blir totalinntekt aQ−bQ² og marginalinntekt a−2bQ. Ved konstant MC=c og a>c er den indre løsningen Q=(a−c)/(2b).", "formula": "MR=a−2bQ · Qm=(a−c)/(2b) · Pm=(a+c)/2", "example": "P=100−Q og MC=10 gir Qm=45 og Pm=55. Inntekten er 2475 og variable kostnader 450; profitt før faste kostnader er 2025.", "strategy": "Markedsmakt gir prisrom, men konkurranse, regulering og etablering kan begrense det.", "sections": [{"title": "Hvorfor MR er under pris", "text": "Ved en enhetlig pris må lavere pris gjelde alle solgte enheter. Ekstra mengde gir ny inntekt, men prisreduksjonen reduserer også inntekten på eksisterende salg."}, {"title": "Kontroller deltakelse", "text": "MR=MC er en kandidatbetingelse. Sjekk relevante kapasitetsgrenser, andreordensvilkår og om produksjon er bedre enn å stoppe i den aktuelle tidshorisonten."}], "area": "mikro", "category": "mikro"}, {"id": "e5", "title": "Samlet etterspørsel og samlet tilbud", "subtitle": "Bruk AD–AS til å skille sjokk.", "body": "AD viser etterspurt samlet produksjon ved ulike prisnivåer i modellen. Kortsiktig AS knytter prisnivå og tilbudt produksjon, mens langsiktig AS ofte tegnes ved potensiell produksjon. Virkningene av et sjokk avhenger av hvilken kurve som flyttes og hvordan forventninger og politikk reagerer.", "formula": "Etterspørselssjokk: Y og P samme retning kortsiktig · negativt tilbudssjokk: Y ned, P opp", "example": "Økte energikostnader kan forskyve kortsiktig AS mot venstre. Produksjonen faller og prisnivået stiger i standardmodellen med uendret AD.", "strategy": "Et fall i salg kombinert med høyere kostnader krever annen respons enn et rent etterspørselsfall.", "sections": [{"title": "Prisnivå mot inflasjon", "text": "Et statisk AD–AS-diagram sammenligner prisnivåer. For å forklare vedvarende inflasjon må vi også beskrive utviklingen over tid, forventninger og gjentatte sjokk."}, {"title": "Lang sikt", "text": "Potensiell produksjon påvirkes blant annet av kapital, arbeidskraft, teknologi og institusjoner. Langsiktig tilpasning er ikke en påstand om at ressurser alltid er fullt utnyttet på kort sikt."}], "area": "makro", "category": "makro"}, {"id": "e6", "title": "Økonomisk vekst og produktivitet", "subtitle": "Hvorfor produksjon per innbygger øker.", "body": "Langsiktig levestandard avhenger særlig av produktivitet og sysselsetting. Kapital per arbeider kan øke produksjon per arbeider, men avtakende marginalavkastning begrenser veksten fra kapitalakkumulasjon alene i standard Solow-modell. Teknologisk fremgang driver varig vekst per arbeider i den grunnleggende modellen.", "formula": "Y=A·F(K,L) · produksjon per arbeider: y=Y/L", "example": "Hvis produksjonen øker fra 100 til 105 med uendret arbeidstid, øker målt arbeidsproduktivitet 5 %. Det sier ikke alene om økningen skyldes teknologi eller mer kapital.", "strategy": "Invester i kompetanse, organisering og teknologi; skill midlertidig kapasitetsutnyttelse fra varige produktivitetsforbedringer.", "sections": [{"title": "Nivå mot vekstrate", "text": "Høyere sparing kan gi et høyere langsiktig produksjonsnivå per arbeider i Solow-modellen, men ikke varig høyere vekstrate per arbeider uten teknologisk fremgang."}, {"title": "Måleutfordringer", "text": "Produktivitet bør måles med relevante ressursinnsatser og kvalitet. Økt produksjon per ansatt kan skyldes lengre arbeidstid hvis timer ikke tas med."}], "area": "makro", "category": "makro"}, {"id": "e7", "title": "Automatiske stabilisatorer og budsjettbalanse", "subtitle": "Skill konjunkturer fra aktive vedtak.", "body": "Skatteinntekter faller og enkelte overføringer øker normalt i nedgangstider. Dette støtter privat disponibel inntekt og demper svingninger uten nye vedtak. Et svekket budsjett trenger derfor ikke bety at politikerne aktivt har lagt om finanspolitikken.", "formula": "Faktisk budsjettbalanse = strukturell komponent + konjunkturell komponent (forenklet)", "example": "I en lavkonjunktur blir færre sysselsatt, skatteinntektene faller og dagpengeutbetalingene øker. Underskuddet øker selv med uendrede satser og regler.", "strategy": "Planlegg etter både vedtatte tiltak og automatiske endringer i husholdningenes inntekt.", "sections": [{"title": "Strukturell balanse", "text": "En konjunkturkorrigert balanse forsøker å anslå budsjettet ved normal kapasitetsutnyttelse. Anslaget avhenger av usikre vurderinger av potensielt BNP og skattefølsomhet."}, {"title": "Ikke alle underskudd er like", "text": "Et midlertidig underskudd fra konjunkturledighet har en annen forklaring enn varig ubalanse mellom utgifter og inntekter. Gjeldsbærekraft krever en vurdering over tid."}], "area": "makro", "category": "makro"}, {"id": "e8", "title": "Nominell og reell vekst", "subtitle": "Korriger vekst for prisendringer.", "body": "Nominell vekst kombinerer mengde- og prisendringer. Reell vekst isolerer volumendringen ved å korrigere med en relevant prisindeks. Subtraksjon er en tilnærming; ved større endringer bør du bruke forholdet mellom vekstfaktorene.", "formula": "Reell vekst = (1+nominell vekst)/(1+prisvekst)−1", "example": "Nominelt BNP vokser 8 % og BNP-deflatoren 5 %. Reell vekst er 1,08/1,05−1 ≈ 2,86 %, ikke nøyaktig 3 %.", "strategy": "Bruk riktig prisindeks for det du analyserer. KPI og BNP-deflatoren dekker ulike varekurver.", "sections": [{"title": "Prosent mot prosentpoeng", "text": "Rente fra 4 % til 5 % er en økning på 1 prosentpoeng og 25 % relativt til utgangspunktet. Oppgi hvilken måleenhet du bruker."}, {"title": "Riktig indeks", "text": "BNP-deflatoren gjelder innenlandsk produksjon, mens KPI gjelder husholdningenes konsumkurv, inkludert import. Indeksene kan derfor utvikle seg ulikt."}], "area": "makro", "category": "makro"}], "questions": [{"topic": "1", "question": "Hva skjer vanligvis med pris og mengde når etterspørselen øker og tilbudskurven heller oppover?", "options": ["Begge øker", "Begge faller", "Prisen faller, mengden øker"], "answer": 0, "explanation": "Etterspørselskurven forskyves mot høyre, og ny likevekt ligger høyere langs tilbudskurven.", "id": "q1", "level": "grunnleggende"}, {"topic": "2", "question": "Hva betyr en priselastisitet på −0,4?", "options": ["Etterspørselen er elastisk", "Etterspørselen er uelastisk", "Mengden stiger når prisen stiger"], "answer": 1, "explanation": "En prisøkning på 1 % gir omtrent 0,4 % lavere etterspurt mengde lokalt.", "id": "q2", "level": "grunnleggende"}, {"topic": "3", "question": "En ekstra enhet gir MR = 80 og MC = 100. Hva skjer med overskuddet?", "options": ["Det øker med 20", "Det er uendret", "Det faller med 20"], "answer": 2, "explanation": "Bidraget til overskuddet er MR − MC = −20.", "id": "q3", "level": "grunnleggende"}, {"topic": "4", "question": "Hvor leser en monopolist av salgsprisen etter å ha valgt mengde?", "options": ["På etterspørselskurven", "På marginalkostnadskurven", "På kurven for faste kostnader"], "answer": 0, "explanation": "MR = MC bestemmer kandidat til optimal mengde; etterspørselen bestemmer prisen kundene betaler.", "id": "q4", "level": "grunnleggende"}, {"topic": "5", "question": "Er en Nash-likevekt alltid best for aktørene samlet?", "options": ["Ja, per definisjon", "Nei", "Bare med to aktører"], "answer": 1, "explanation": "Likevekt handler om ensidige avvik, ikke om samlet velferd.", "id": "q5", "level": "grunnleggende"}, {"topic": "6", "question": "Hva er et kjennetegn ved et rent offentlig gode?", "options": ["Det produseres alltid av staten", "Det er rivaliserende", "Det er ikke-rivaliserende og ikke-ekskluderbart"], "answer": 2, "explanation": "Klassifiseringen bygger på egenskapene ved konsum og ekskludering, ikke hvem som produserer godet.", "id": "q6", "level": "grunnleggende"}, {"topic": "7", "question": "Hva er BNP når C=600, I=150, G=200, X=100 og M=80?", "options": ["1050", "970", "1130"], "answer": 1, "explanation": "600 + 150 + 200 + 100 − 80 = 970.", "id": "q7", "level": "grunnleggende"}, {"topic": "8", "question": "Inflasjonen faller fra 5 % til 2 %. Hva betyr det?", "options": ["Prisnivået faller 3 %", "Alle priser faller", "Det generelle prisnivået stiger saktere"], "answer": 2, "explanation": "Dette er desinflasjon. Negativ inflasjon kalles deflasjon.", "id": "q8", "level": "grunnleggende"}, {"topic": "9", "question": "Hva er en vanlig virkning av høyere styringsrente, alt annet likt?", "options": ["Lavere investeringer", "Automatisk høyere BNP", "Lavere lånekostnader"], "answer": 0, "explanation": "Høyere finansieringskostnader gjør færre investeringsprosjekter lønnsomme.", "id": "q9", "level": "grunnleggende"}, {"topic": "10", "question": "Hva er multiplikatoren i den enkle modellen når c = 0,8?", "options": ["0,2", "5", "1,8"], "answer": 1, "explanation": "k = 1/(1 − 0,8) = 5 under modellens strenge forutsetninger.", "id": "q10", "level": "grunnleggende"}, {"topic": "11", "question": "Hva er ledighetsraten med 50 ledige og 950 sysselsatte?", "options": ["5 %", "5,26 %", "50 %"], "answer": 0, "explanation": "50/(50 + 950) × 100 = 5 %.", "id": "q11", "level": "grunnleggende"}, {"topic": "12", "question": "NOK/EUR øker fra 10 til 11. Hva har skjedd med kronen?", "options": ["Den er styrket", "Ingenting", "Den er svekket"], "answer": 2, "explanation": "Du må betale flere kroner for én euro. Kronens verdi målt i euro faller med omtrent 9,09 %.", "id": "q12", "level": "grunnleggende"}, {"id": "q13", "topic": "g1", "question": "I cellen (2,7), hvilken gevinst har radspilleren?", "options": ["2", "7", "9"], "answer": 0, "explanation": "Det første tallet tilhører alltid radspilleren i konvensjonen vi bruker.", "level": "grunnleggende"}, {"id": "q14", "topic": "g1", "question": "Hva betyr simultane valg i et spill?", "options": ["Valg på eksakt samme klokkeslett", "At aktørene har ukjente kostnader", "Valg uten å observere motpartens aktuelle handling"], "answer": 2, "explanation": "Simultanitet handler om observasjon av de aktuelle valgene. Det er noe annet enn ukjente typer.", "level": "grunnleggende"}, {"id": "q15", "topic": "g2", "question": "Kolonne velger Venstre. Rad får 6 ved Øverst og 4 ved Nederst. Hva er rads beste respons?", "options": ["Bytte kolonne til Høyre", "Øverst", "Nederst"], "answer": 1, "explanation": "Hold Venstre fast og sammenlign rads egne gevinster: 6>4. Rad kan ikke endre kolonnes valg.", "level": "grunnleggende"}, {"id": "q16", "topic": "g2", "question": "Hvordan finner du kolonnes beste respons i en matrise?", "options": ["Hold en rad fast og sammenlign andre tall horisontalt", "Sammenlign første tall horisontalt", "Velg cellen med høyest sum"], "answer": 0, "explanation": "Kolonne endrer kolonnevalg mens radvalget holdes fast. Bruk derfor andre tall på samme rad.", "level": "grunnleggende"}, {"id": "q17", "topic": "g2", "question": "To egne strategier gir begge 3 mot et gitt motpartsvalg. Hva markerer du?", "options": ["Ingen", "Bare den øverste", "Begge, dersom 3 er maksimal egen gevinst"], "answer": 2, "explanation": "Alle maksimum er beste responser. Vilkårlig utvalg kan gjøre at du overser likevekter.", "level": "grunnleggende"}, {"id": "q18", "topic": "g3", "question": "Hva må gjelde i en Nash-likevekt?", "options": ["Summen av gevinster er størst", "Ingen har et strengt lønnsomt ensidig avvik", "Ingen kan få det bedre dersom begge bytter"], "answer": 1, "explanation": "Nash tester én aktørs avvik om gangen. Koordinerte endringer og samlet gevinst er andre spørsmål.", "level": "grunnleggende"}, {"id": "q19", "topic": "g3", "question": "En kandidat gir rad 4. Et ensidig avvik gir også 4. Avviser dette Nash?", "options": ["Nei, avviket er ikke strengt bedre", "Ja, alle avvik må gi lavere gevinst", "Ja, Nash krever unik beste respons"], "answer": 0, "explanation": "Nash bruker svak ulikhet. Indifferens er tillatt.", "level": "grunnleggende"}, {"id": "q20", "topic": "g3", "question": "Et endelig spill har ingen rene Nash-likevekter. Hva kan vi si?", "options": ["Det har ingen Nash-likevekt", "Alle strategier er like gode", "Det har minst én likevekt når blandede strategier tillates"], "answer": 2, "explanation": "Eksistensresultatet for endelige spill gjelder når blandede strategier tillates. Det sikrer ikke en ren løsning.", "level": "grunnleggende"}, {"id": "q21", "topic": "g4", "question": "Rad får 5 mot Venstre og 4 mot Høyre ved A; ved B får rad 3 og 2. Hvilken strategi er strengt dominant?", "options": ["Ingen", "A", "B"], "answer": 1, "explanation": "A gir mer enn B i begge kolonner: 5>3 og 4>2.", "level": "grunnleggende"}, {"id": "q22", "topic": "g4", "question": "Krever Nash at hver aktør har en dominant strategi?", "options": ["Nei", "Ja", "Bare i tospillerspill"], "answer": 0, "explanation": "En likevektsstrategi trenger bare være best mot motpartens likevektsstrategi, ikke mot alle mulige strategier.", "level": "grunnleggende"}, {"id": "q23", "topic": "g4", "question": "Hva kan skje ved eliminering av svakt dominerte strategier?", "options": ["Alle Nash-likevekter bevares alltid", "Alle blandede likevekter blir unike", "Nash-likevekter kan forsvinne"], "answer": 2, "explanation": "I motsetning til streng dominans kan svak eliminering fjerne likevekter. Rekkefølgen kan også ha betydning.", "level": "grunnleggende"}, {"id": "q24", "topic": "g5", "question": "Med T=5, R=3, P=1 og S=0, hva er avviksgevinsten når motparten samarbeider?", "options": ["5", "2", "4"], "answer": 1, "explanation": "Avvik gir T=5 i stedet for R=3. Gevinstøkningen er 5−3=2, ikke selve nivået 5.", "level": "grunnleggende"}, {"id": "q25", "topic": "g5", "question": "Hva er den unike Nash-likevekten i standard engangs fangens dilemma?", "options": ["Begge avviker", "Begge samarbeider", "En samarbeider, en avviker"], "answer": 0, "explanation": "Avvik er strengt dominant for begge, så begge avviker.", "level": "grunnleggende"}, {"id": "q26", "topic": "g6", "question": "Kan to ulike koordinerte utfall begge være Nash?", "options": ["Nei", "Bare hvis summen av gevinstene er lik", "Ja"], "answer": 2, "explanation": "Begge kan være gjensidige beste responser selv om én likevekt gir høyere gevinst til begge.", "level": "middels"}, {"id": "q27", "topic": "g6", "question": "Begge foretrekker å koordinere, men er uenige om hvilken løsning de ønsker. Hva beskriver dette?", "options": ["Standard fangens dilemma", "Battle of the Sexes", "Matching pennies"], "answer": 1, "explanation": "Spillet kombinerer felles ønske om koordinering med konflikt om hvilken koordinert løsning som er best.", "level": "middels"}, {"id": "q28", "topic": "g7", "question": "I Chicken, hva er beste respons mot en hard motpart i eksemplet?", "options": ["Myk", "Hard", "Begge må alltid være harde"], "answer": 0, "explanation": "Myk gir 0 mens Hard gir −2 mot Hard. Beste respons er derfor Myk.", "level": "middels"}, {"id": "q29", "topic": "g8", "question": "Pareto-dominerer (5,0) utfallet (3,3)?", "options": ["Ja, fordi 5>3", "Ja, fordi én får det bedre", "Nei"], "answer": 2, "explanation": "Kolonne faller fra 3 til 0. Pareto-dominans krever at ingen får det verre.", "level": "middels"}, {"id": "q30", "topic": "g8", "question": "Kan en Nash-likevekt være Pareto-ineffektiv?", "options": ["Bare ved ufullstendig informasjon", "Ja", "Nei"], "answer": 1, "explanation": "Gjensidig avvik i fangens dilemma er Nash, men Pareto-domineres av gjensidig samarbeid.", "level": "middels"}, {"id": "q31", "topic": "g9", "question": "Rad får 6 mot Venstre og 2 mot Høyre ved A. Venstre spilles med 0,25. Hva er forventet gevinst?", "options": ["3", "4", "2,5"], "answer": 0, "explanation": "0,25·6+0,75·2 = 1,5+1,5 = 3.", "level": "middels"}, {"id": "q32", "topic": "g9", "question": "Hva må gjelde for to rene strategier som brukes med positiv sannsynlighet i en blandet beste respons?", "options": ["De har samme navn", "Hver gir høyest gevinst i alle celler", "De gir samme forventede gevinst"], "answer": 2, "explanation": "Hvis én gir strengt mer, vil det være lønnsomt å flytte sannsynlighet til den. Kontroller også at utelatte strategier ikke er bedre.", "level": "middels"}, {"id": "q33", "topic": "g10", "question": "Rad får 3q ved A og 2(1−q) ved B. Hvilken q gjør rad indifferent?", "options": ["1/2", "2/5", "3/5"], "answer": 1, "explanation": "3q=2−2q gir 5q=2 og q=2/5. q er kolonnes sannsynlighet.", "level": "fordypning"}, {"id": "q34", "topic": "g10", "question": "Kolonne får 2p ved V og 3(1−p) ved H. Hvilken p gjør kolonne indifferent?", "options": ["3/5", "2/5", "1/2"], "answer": 0, "explanation": "2p=3−3p gir 5p=3 og p=3/5. p er rads sannsynlighet.", "level": "fordypning"}, {"id": "q35", "topic": "g10", "question": "En beregning gir q=1,2 som kandidat til en indre blandet likevekt. Hva gjør du?", "options": ["Rund av til 1 og kall det likevekt", "Bruk 120 % som blanding", "Avvis som ugyldig sannsynlighet og undersøk andre støtter/randløsninger"], "answer": 2, "explanation": "En blandingssannsynlighet må ligge i [0,1]. Avrunding gjør ikke en ugyldig kandidat til en likevekt.", "level": "fordypning"}, {"id": "q36", "topic": "g11", "question": "Hva er blandingen i standard matching pennies?", "options": ["Rad spiller Krone og kolonne Mynt alltid", "Begge spiller Krone med 1/2", "Begge spiller Krone alltid"], "answer": 1, "explanation": "Halvparten på hver side gjør motparten indifferent. Alle rene profiler har et lønnsomt ensidig avvik.", "level": "middels"}, {"id": "q37", "topic": "g11", "question": "Hvorfor er standard matching pennies et nullsumspill?", "options": ["Gevinstene summerer til null i hver celle", "Begge får alltid null", "Det finnes ingen tap"], "answer": 0, "explanation": "I hver celle får én 1 og den andre −1. Hver enkel realisasjon har vinnere og tapere.", "level": "middels"}, {"id": "q38", "topic": "g12", "question": "En aktør skal velge etter enten A eller B. Hva må en ren strategi beskrive?", "options": ["Bare handlingen som faktisk blir spilt", "Bare den første aktørens valg", "Handling etter både A og B"], "answer": 2, "explanation": "En strategi er en fullstendig plan ved alle egne informasjonssett, også utenfor likevektsbanen.", "level": "middels"}, {"id": "q39", "topic": "g12", "question": "Er perfekt informasjon det samme som fullstendig informasjon?", "options": ["Bare når begge tjener positivt", "Nei", "Ja"], "answer": 1, "explanation": "Perfekt informasjon gjelder observasjon av tidligere handlinger. Fullstendig informasjon gjelder kjennskap til blant annet gevinster/typer.", "level": "middels"}, {"id": "q40", "topic": "g13", "question": "Etter Inn gir Hard den etablerte 1 og Myk 2. Hva velger den ved baklengs induksjon?", "options": ["Myk", "Hard", "Ute"], "answer": 0, "explanation": "Den etablerte velger 2 fremfor 1 etter Inn. Ute er nykommerens handling, ikke den etablertes.", "level": "middels"}, {"id": "q41", "topic": "g13", "question": "Nykommer får 0 ved Ute og 2 ved Inn når den etablerte svarer optimalt. Hva blir utfallet?", "options": ["Ute, Hard", "Inn, Hard", "Inn, Myk"], "answer": 2, "explanation": "Baklengs induksjon finner først Myk etter Inn. Nykommer sammenligner deretter 2 med 0 og velger Inn.", "level": "middels"}, {"id": "q42", "topic": "g13", "question": "Er enhver Nash-likevekt delspillperfekt?", "options": ["Bare hvis spillet har to aktører", "Nei", "Ja"], "answer": 1, "explanation": "Delspillperfeksjon legger til kravet om Nash i hvert delspill. Ikke-troverdige planer kan være forenlige med vanlig Nash.", "level": "middels"}, {"id": "q43", "topic": "g14", "question": "Hva kjennetegner en troverdig trussel i et delspill?", "options": ["Den er optimal å gjennomføre når valget faktisk skal tas, eller er bindende", "Den blir sagt med stor sikkerhet", "Den gjør begge parter dårligere stilt"], "answer": 0, "explanation": "En kostnadsfri erklæring uten endrede insentiver er ikke automatisk en troverdig forpliktelse.", "level": "middels"}, {"id": "q44", "topic": "g14", "question": "Gir det alltid en fordel å velge først?", "options": ["Ja", "Bare i alle nullsumspill", "Nei, det avhenger av spillet"], "answer": 2, "explanation": "Timing kan hjelpe eller skade. Stackelberg gir en fordel under bestemte forutsetninger, men er ikke et generelt bevis.", "level": "middels"}, {"id": "q45", "topic": "g15", "question": "Hva er nåverdien av 3 hver periode fra nå med δ=0,8?", "options": ["12", "15", "3,75"], "answer": 1, "explanation": "Den geometriske rekken summerer til 3/(1−0,8)=15.", "level": "middels"}, {"id": "q46", "topic": "g15", "question": "Hva innebærer høyere δ i den standard gjentatte modellen?", "options": ["Fremtidige gevinster veier mer", "Fremtidige gevinster veier mindre", "Alle aktører må samarbeide"], "answer": 0, "explanation": "Høyere δ øker verdien av fremtidig samhandling, men samarbeid krever fortsatt at insentivvilkårene er oppfylt.", "level": "middels"}, {"id": "q47", "topic": "g16", "question": "Med T=5, R=3, P=1, hva er grim-trigger-terskelen for δ?", "options": ["1/3", "3/4", "1/2"], "answer": 2, "explanation": "δ≥(T−R)/(T−P)=(5−3)/(5−1)=2/4=1/2.", "level": "fordypning"}, {"id": "q48", "topic": "g16", "question": "Med T=8, R=5, P=2, hva er grim-trigger-terskelen?", "options": ["2/5", "1/2", "3/8"], "answer": 1, "explanation": "(8−5)/(8−2)=3/6=1/2. Dette gjelder uendelig gjentakelse og de oppgitte triggerstrategiene.", "level": "fordypning"}, {"id": "q49", "topic": "g16", "question": "Ved δ=0,4 og T=5,R=3,P=1, er grim-trigger-samarbeid insentivforenlig?", "options": ["Nei", "Ja", "Alltid, fordi samarbeid gir 3"], "answer": 0, "explanation": "Samarbeid gir 3/0,6=5. Avvik gir 5+0,4/0,6≈5,67. Avvik er mer lønnsomt.", "level": "fordypning"}, {"id": "q50", "topic": "g17", "question": "I Cournot med P=100−q₁−q₂ og MC=10, hva er BR₁(q₂) i det indre området?", "options": ["90−q₂", "(100−q₂)/2", "(90−q₂)/2"], "answer": 2, "explanation": "π₁=(90−q₁−q₂)q₁. Derivert er 90−2q₁−q₂. Sett lik null og løs for q₁.", "level": "fordypning"}, {"id": "q51", "topic": "g17", "question": "I det samme Cournot-spillet, hva produserer hver i symmetrisk likevekt?", "options": ["90", "30", "45"], "answer": 1, "explanation": "q=(90−q)/2 gir 3q=90 og q=30. Total mengde er 60 og pris 40.", "level": "fordypning"}, {"id": "q52", "topic": "g17", "question": "Hva er hver bedrifts profitt i Cournot-eksemplet uten faste kostnader?", "options": ["900", "1200", "1800"], "answer": 0, "explanation": "Hver selger 30 til pris 40 med kostnad 10 per enhet: (40−10)·30=900.", "level": "fordypning"}, {"id": "q53", "topic": "g18", "question": "Hvilken forutsetning er sentral for standard Bertrand-resultatet P=c?", "options": ["At prisene er regulert", "At hver bedrift har monopol", "Identiske produkter og kapasitet til å dekke etterspørselen"], "answer": 2, "explanation": "Resultatet bygger også på blant annet like konstante marginalkostnader og kontinuerlige priser.", "level": "middels"}, {"id": "q54", "topic": "g18", "question": "Hva holdes fast ved et ensidig avvik i Bertrand?", "options": ["Markedsprisen uansett egen handling", "Konkurrentens pris", "Konkurrentens mengde"], "answer": 1, "explanation": "Bertrand er et prisspill. I Cournot holdes i stedet konkurrentens mengde fast.", "level": "middels"}, {"id": "q55", "topic": "g19", "question": "Med P=100−qL−qF og MC=10, hva er Stackelberg-lederens mengde?", "options": ["45", "30", "22,5"], "answer": 0, "explanation": "Følgerens respons er (90−qL)/2. Lederens profitt er 45qL−qL²/2. Derivert 45−qL=0 gir qL=45.", "level": "fordypning"}, {"id": "q56", "topic": "g19", "question": "Hva produserer følgeren når lederen velger 45 i Stackelberg-eksemplet?", "options": ["45", "30", "22,5"], "answer": 2, "explanation": "Følgerens beste respons er (90−45)/2=22,5. Pris blir 32,5.", "level": "fordypning"}, {"id": "q57", "topic": "g20", "question": "En handling gir 8 ved lav type og −2 ved høy type. Pr(lav)=0,25. Hva er forventet gevinst?", "options": ["3", "0,5", "2"], "answer": 1, "explanation": "0,25·8+0,75·(−2)=2−1,5=0,5.", "level": "fordypning"}, {"id": "q58", "topic": "g20", "question": "Den samme usikre handlingen konkurrerer med sikker gevinst 1. Når foretrekkes den usikre svakt?", "options": ["Når p≥0,3", "Når p≥0,1", "Alltid"], "answer": 0, "explanation": "8p−2(1−p)≥1 gir 10p≥3, altså p≥0,3.", "level": "fordypning"}, {"id": "q59", "topic": "g20", "question": "Hva må en Bayesiansk strategi angi?", "options": ["Bare en sannsynlighet for motpartens type", "Bare handlingen til den mest sannsynlige typen", "En handling for hver egen type"], "answer": 2, "explanation": "Hver type må velge optimalt gitt egne opplysninger og oppfatninger om andres typer og strategier enstre?", "options": ["Nederst", "Ingen beste respons", "Øverst"], "answer": 2, "explanation": "Hold Venstre fast. Rads gevinster er Øverst: 2, Nederst: -2. Maksimum oppnås ved Øverst.", "level": "middels", "game": "zero"}, {"id": "q99", "topic": "g9", "question": "Et asymmetrisk nullsumspill: Hva er kolonnes beste respons når rad velger Øverst?", "options": ["Ingen beste respons", "Høyre", "Venstre"], "answer": 1, "explanation": "Hold Øverst fast. Kolonnes gevinster er Venstre: -2, Høyre: 1. Maksimum oppnås ved Høyre.", "level": "middels", "game": "zero"}, {"id": "q100", "topic": "g9", "question": "Et asymmetrisk nullsumspill: Er (Øverst, Venstre) en ren Nash-likevekt?", "options": ["Ja, begge spiller beste respons", "Nei, minst én har et strengt lønnsomt ensidig avvik", "Det avgjøres bare av summen av gevinster"], "answer": 1, "explanation": "Kolonne kan øke fra -2 til 1 ved å velge Høyre mens rad holder Øverst.", "level": "middels", "game": "zero"}, {"id": "q101", "topic": "g13", "question": "Etablering: normalform: Hvilke er ALLE Nash-likevektene i rene strategier?", "options": ["(Inn, Hard)", "(Inn, Myk)", "(Inn, Myk), (Ute, Hard)"], "answer": 2, "explanation": "I (Inn, Myk) er 2 størst blant rads gevinster i Myk, og 2 størst blant kolonnes gevinster i Inn. I (Ute, Hard) er 0 størst blant rads gevinster i Hard, og 4 størst blant kolonnes gevinster i Ute. To rene Nash: Inn/Myk og Ute/Hard. Bare Inn/Myk er delspillperfekt når kolonne velger etter å ha observert Inn. Etter Inn er Myk bedre for kolonne enn Hard.", "level": "middels", "game": "entry"}, {"id": "q102", "topic": "g13", "question": "Etablering: normalform: Hva er rads beste respons når kolonne velger Hard?", "options": ["Ingen beste respons", "Ute", "Inn"], "answer": 1, "explanation": "Hold Hard fast. Rads gevinster er Inn: -1, Ute: 0. Maksimum oppnås ved Ute.", "level": "middels", "game": "entry"}, {"id": "q103", "topic": "g13", "question": "Etablering: normalform: Hva er kolonnes beste respons når rad
