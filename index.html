 "Nei, minst én har et strengt lønnsomt ensidig avvik"], "answer": 1, "explanation": "Ingen av aktørene har et strengt lønnsomt ensidig avvik. Eventuelle like gode avvik er tillatt i Nash.", "level": "middels", "game": "three"}, {"id": "q109", "topic": "1", "question": "Qd=120−2P og Qs=3P. Hva er likevektsprisen?", "options": ["24", "40", "60"], "answer": 0, "explanation": "120−2P=3P gir 120=5P og P=24. Mengden er 72.", "level": "middels"}, {"id": "q110", "topic": "1", "question": "Hva gir et positivt tilbudssjokk med fallende etterspørsel, alt annet likt?", "options": ["Høyere pris og mengde", "Lavere pris og mengde", "Lavere pris og høyere mengde"], "answer": 2, "explanation": "Tilbudet forskyves mot høyre. Ny likevekt ligger lenger ned langs etterspørselen.", "level": "middels"}, {"id": "q111", "topic": "2", "question": "For Q=100−2P ved P=30, hva er punktelastisiteten?", "options": ["−0,5", "−1,5", "−2"], "answer": 1, "explanation": "Q=40 og dQ/dP=−2. Elastisitet er −2·30/40=−1,5.", "level": "middels"}, {"id": "q112", "topic": "2", "question": "Ved elastisk etterspørsel, hva skjer normalt med salgsinntekten ved en liten prisreduksjon?", "options": ["Den øker", "Den faller", "Den er alltid uendret"], "answer": 0, "explanation": "Mengden øker prosentvis mer enn prisen faller. Dette gjelder omsetning; profitt krever også kostnader.", "level": "middels"}, {"id": "q113", "topic": "3", "question": "TR=1000 og TC=750. Hva er profitt?", "options": ["1750", "750", "250"], "answer": 2, "explanation": "π=TR−TC=1000−750=250.", "level": "middels"}, {"id": "q114", "topic": "3", "question": "En allerede betalt kostnad kan ikke gjenvinnes. Hvordan behandles den i et nytt marginalt valg?", "options": ["Som en fremtidig marginalkostnad uansett", "Som sunk cost; fremtidige konsekvenser avgjør", "Som den eneste relevante kostnaden"], "answer": 1, "explanation": "En irreversibel historisk kostnad påvirkes ikke av det nye valget. Relevante alternativkostnader kan fortsatt finnes.", "level": "middels"}, {"id": "q115", "topic": "e1", "question": "A kan lage 10 rapporter eller 5 analyser. Hva er alternativkostnaden for én rapport?", "options": ["0,5 analyse", "2 analyser", "5 analyser"], "answer": 0, "explanation": "5/10=0,5 analyse per rapport.", "level": "middels"}, {"id": "q116", "topic": "e1", "question": "Betyr absolutt fortrinn i alt at handel aldri kan gi gevinst?", "options": ["Ja", "Bare hvis begge er like store", "Nei"], "answer": 2, "explanation": "Gevinstene bygger på ulike relative alternativkostnader, ikke bare absolutt produktivitet.", "level": "middels"}, {"id": "q117", "topic": "e2", "question": "Makspris=50, P*=30 og Q*=40 ved lineær etterspørsel. Hva er konsumentoverskuddet?", "options": ["1200", "400", "800"], "answer": 1, "explanation": "Trekantarealet er ½·(50−30)·40=400.", "level": "middels"}, {"id": "q118", "topic": "e3", "question": "Hvilken side bærer normalt størst avgiftsbyrde?", "options": ["Den minst priselastiske siden", "Alltid den som betaler avgiften til staten", "Alltid kjøperne"], "answer": 0, "explanation": "Lavere prisfølsomhet gir mindre mulighet til å unngå avgiften gjennom mengdetilpasning.", "level": "middels"}, {"id": "q119", "topic": "e3", "question": "Qd=100−2Pk, Qs=10+Ps, t=6. Hva blir kjøperprisen?", "options": ["36", "26", "32"], "answer": 2, "explanation": "Pk=Ps+6. 100−2(Ps+6)=10+Ps gir Ps=26 og Pk=32. Mengden er 36.", "level": "middels"}, {"id": "q120", "topic": "e3", "question": "I samme avgiftseksempel er Q=36 og t=6. Hva er skatteinntekten?", "options": ["12", "216", "240"], "answer": 1, "explanation": "Avgift per enhet ganger omsatt mengde: 6·36=216. Dødvektstapet 12 er et annet mål.", "level": "middels"}, {"id": "q121", "topic": "e4", "question": "P=100−Q og MC=10. Hva er monopolmengden?", "options": ["45", "90", "30"], "answer": 0, "explanation": "MR=100−2Q=10 gir Q=45. Prisen leses av etterspørselen og blir 55.", "level": "middels"}, {"id": "q122", "topic": "7", "question": "Er kjøp av eksisterende aksjer direkte en realinvestering i BNP?", "options": ["Ja, alltid", "Bare når aksjen stiger", "Nei"], "answer": 2, "explanation": "Finansielle eierskifter er ikke i seg selv produksjon av realkapital. Tjenester knyttet til handelen kan være produksjon.", "level": "middels"}, {"id": "q123", "topic": "8", "question": "Nominell rente=6 % og forventet inflasjon=4 %. Hva er forventet realrente omtrent?", "options": ["−2 %", "2 %", "10 %"], "answer": 1, "explanation": "Tilnærmet r=i−πᵉ=6−4=2 %. Eksakt: 1,06/1,04−1≈1,92 %.", "level": "middels"}, {"id": "q124", "topic": "9", "question": "Hvorfor virker ikke en renteendring nødvendigvis fullt ut straks?", "options": ["Pengepolitikk virker gjennom flere kanaler med etterslep", "Renten påvirker aldri økonomien", "Alle lån har samme rentebinding"], "answer": 0, "explanation": "Eksisterende kontrakter, forventninger, investeringsplaner og rentebinding gjør at tilpasningen tar tid.", "level": "middels"}, {"id": "q125", "topic": "10", "question": "c=0,8, t=0,25 og m=0,1. Hva er multiplikatoren i den enkle åpne modellen?", "options": ["5", "2,5", "2"], "answer": 2, "explanation": "1/[1−0,8(1−0,25)+0,1]=1/(1−0,6+0,1)=1/0,5=2.", "level": "middels"}, {"id": "q126", "topic": "11", "question": "En person uten jobb slutter å søke og går ut av arbeidsstyrken. Kan målt ledighetsrate falle uten at noen får jobb?", "options": ["Bare hvis BNP faller", "Ja", "Nei"], "answer": 1, "explanation": "Både teller og nevner endres når en arbeidsledig går ut av arbeidsstyrken. Derfor må ledighet ses sammen med yrkesdeltakelse.", "level": "middels"}, {"id": "q127", "topic": "12", "question": "NOK/EUR øker fra 10 til 11. En import på 100 euro koster nå hvor mye?", "options": ["1100 kroner", "1000 kroner", "900 kroner"], "answer": 0, "explanation": "100·11=1100 kroner. Før kostet den 1000, en økning på 10 % målt i kroner.", "level": "middels"}, {"id": "q128", "topic": "e5", "question": "Et negativt tilbudssjokk i standard kortsiktig AD–AS med uendret AD gir normalt hva?", "options": ["Høyere produksjon og lavere prisnivå", "Høyere produksjon og prisnivå", "Lavere produksjon og høyere prisnivå"], "answer": 2, "explanation": "AS flyttes mot venstre: produksjonen faller og prisnivået stiger. Dynamisk inflasjon krever analyse over tid.", "level": "middels"}, {"id": "q129", "topic": "e6", "question": "Hva gir høyere sparing alene i grunnleggende Solow-modell uten endret teknologivekst?", "options": ["Automatisk lavere kapital per arbeider", "Høyere langsiktig nivå per arbeider, ikke varig høyere vekstrate", "Varig høyere vekstrate per arbeider"], "answer": 1, "explanation": "Kapitalakkumulasjon møter avtakende avkastning. Et nytt høyere nivå kan nås, men varig vekst per arbeider krever teknologisk fremgang i modellen.", "level": "middels"}, {"id": "q130", "topic": "e7", "question": "Skatteinntektene faller i en nedgang uten nye vedtak. Hva er dette et eksempel på?", "options": ["Automatiske stabilisatorer", "Nødvendigvis aktiv skattelette", "Alltid en regnefeil"], "answer": 0, "explanation": "Uendrede skattesatser gir likevel lavere inntekter når skattegrunnlaget faller. Budsjettet reagerer automatisk på konjunkturen.", "level": "middels"}, {"id": "q131", "topic": "e8", "question": "Nominell vekst=8 %, prisvekst=5 %. Hva er eksakt reell vekst omtrent?", "options": ["3,00 %", "13 %", "2,86 %"], "answer": 2, "explanation": "1,08/1,05−1≈0,028571, altså 2,86 %. Subtraksjon gir bare en tilnærming.", "level": "middels"}, {"id": "q132", "topic": "e8", "question": "Renten øker fra 4 % til 5 %. Hvor mange prosentpoeng er økningen?", "options": ["0,25", "1", "25"], "answer": 1, "explanation": "5−4=1 prosentpoeng. Relativ økning er (5−4)/4=25 %, som er et annet mål.", "level": "middels"}], "games": [{"id": "prison", "title": "Fangens dilemma", "rows": ["Samarbeid", "Avvik"], "cols": ["Samarbeid", "Avvik"], "payoffs": [[[3, 3], [0, 5]], [[5, 0], [1, 1]]], "topic": "g5", "note": "Begge har Avvik som strengt dominant strategi. Gjensidig samarbeid gir høyere gevinst til begge, men er ikke stabilt mot ensidige avvik.", "equilibria": ["1-1"]}, {"id": "coord", "title": "Felles teknologistandard", "rows": ["A", "B"], "cols": ["A", "B"], "payoffs": [[[4, 4], [0, 0]], [[0, 0], [2, 2]]], "topic": "g6", "note": "Begge vil matche motpartens standard. Begge diagonalene er Nash, selv om A/A Pareto-dominerer B/B.", "equilibria": ["0-0", "1-1"]}, {"id": "battle", "title": "Koordinering med ulike preferanser", "rows": ["A", "B"], "cols": ["A", "B"], "payoffs": [[[3, 2], [0, 0]], [[0, 0], [2, 3]]], "topic": "g10", "note": "Begge diagonalene er rene Nash. I indre blandet likevekt velger rad A med 3/5 og kolonne A med 2/5.", "equilibria": ["0-0", "1-1"]}, {"id": "chicken", "title": "Hard eller myk linje", "rows": ["Hard", "Myk"], "cols": ["Hard", "Myk"], "payoffs": [[[-2, -2], [4, 0]], [[0, 4], [2, 2]]], "topic": "g7", "note": "Beste respons er å gjøre det motsatte av motparten. De to asymmetriske cellene er rene Nash. Begge blander Hard med 1/2 i den indre blandede likevekten.", "equilibria": ["0-1", "1-0"]}, {"id": "pennies", "title": "Matching pennies", "rows": ["Krone", "Mynt"], "cols": ["Krone", "Mynt"], "payoffs": [[[1, -1], [-1, 1]], [[-1, 1], [1, -1]]], "topic": "g11", "note": "Ingen celle har begge aktørenes beste respons. Det finnes ingen ren Nash; begge velger hver side med 1/2 i blandet likevekt.", "equilibria": []}, {"id": "stag", "title": "Stag hunt: felles prosjekt", "rows": ["Prosjekt", "Sikkert"], "cols": ["Prosjekt", "Sikkert"], "payoffs": [[[4, 4], [0, 3]], [[3, 0], [2, 2]]], "topic": "g6", "note": "Prosjekt/Prosjekt og Sikkert/Sikkert er rene Nash. Prosjekt gir størst gevinst ved koordinering, men risiko ved manglende deltakelse.", "equilibria": ["0-0", "1-1"]}, {"id": "ties", "title": "Like gevinster teller også", "rows": ["Øverst", "Nederst"], "cols": ["Venstre", "Høyre"], "payoffs": [[[2, 2], [2, 1]], [[2, 0], [1, 1]]], "topic": "g3", "note": "I Venstre er begge radvalg beste responser. I Øverst vil kolonne velge Venstre. Bare Øverst/Venstre er Nash. Et avvik med samme gevinst bryter ikke Nash.", "equilibria": ["0-0"]}, {"id": "dominance", "title": "En dominant aktør", "rows": ["Øverst", "Nederst"], "cols": ["Venstre", "Høyre"], "payoffs": [[[4, 3], [3, 1]], [[2, 0], [1, 2]]], "topic": "g4", "note": "Øverst dominerer Nederst strengt for rad. Kolonne har ingen dominant strategi: Venstre er best mot Øverst, Høyre mot Nederst. Eneste Nash er Øverst/Venstre.", "equilibria": ["0-0"]}, {"id": "price", "title": "Priskonkurranse i en enkel matrise", "rows": ["Høy pris", "Lav pris"], "cols": ["Høy pris", "Lav pris"], "payoffs": [[[8, 8], [1, 10]], [[10, 1], [3, 3]]], "topic": "g5", "note": "Lav pris er strengt dominant for begge: 10>8 og 3>1. Lav/Lav er Nash, selv om Høy/Høy gir høyere samlet overskudd.", "equilibria": ["1-1"]}, {"id": "zero", "title": "Et asymmetrisk nullsumspill", "rows": ["Øverst", "Nederst"], "cols": ["Venstre", "Høyre"], "payoffs": [[[2, -2], [-1, 1]], [[-2, 2], [1, -1]]], "topic": "g9", "note": "Ingen rene likevekter. Rad blander Øverst med 1/2, mens kolonne blander Venstre med 1/3. Spillverdien er 0.", "equilibria": []}, {"id": "entry", "title": "Etablering: normalform", "rows": ["Inn", "Ute"], "cols": ["Hard", "Myk"], "payoffs": [[[-1, 1], [2, 2]], [[0, 4], [0, 4]]], "topic": "g13", "note": "To rene Nash: Inn/Myk og Ute/Hard. Bare Inn/Myk er delspillperfekt når kolonne velger etter å ha observert Inn. Etter Inn er Myk bedre for kolonne enn Hard.", "equilibria": ["0-1", "1-0"]}, {"id": "three", "title": "Tre strategier og dominans", "rows": ["A", "B", "C"], "cols": ["X", "Y", "Z"], "payoffs": [[[3, 3], [0, 2], [1, 0]], [[2, 0], [2, 2], [0, 1]], [[1, 1], [1, 0], [-1, -1]]], "topic": "g4", "note": "C er strengt dominert av B: 2>1, 2>1 og 0>−1. De rene Nash-likevektene er A/X og B/Y. Sjekk alle rad- og kolonnevalg, også i et større spill.", "equilibria": ["0-0", "1-1"]}], "version": 2, "written": [{"id": "w1", "title": "Finn alle rene Nash-likevekter", "topic": "g3", "level": "middels", "prompt": "Bruk matrisen «Like gevinster teller også» i spillverkstedet. Finn alle beste responser, alle rene Nash-likevekter, og forklar om en like god avvikelse utelukker Nash.", "game": "ties", "solution": ["Hold Venstre fast. Rad får 2 ved både Øverst og Nederst, så begge er beste responser. Hold Høyre fast. Rad får 2 ved Øverst og 1 ved Nederst, så bare Øverst er beste respons.", "Hold Øverst fast. Kolonne får 2 ved Venstre og 1 ved Høyre, så Venstre er best. Hold Nederst fast. Kolonne får 0 ved Venstre og 1 ved Høyre, så Høyre er best.", "Bare (Øverst, Venstre) har begge beste responser. Rads avvik til Nederst gir samme gevinst 2, men ikke høyere gevinst. Profilen er derfor Nash."]}, {"id": "w2", "title": "Blandet likevekt med ulike sannsynligheter", "topic": "g10", "level": "fordypning", "prompt": "Bruk «Koordinering med ulike preferanser». Finn de rene likevektene og den indre blandede likevekten. La p være sannsynligheten for at rad spiller A, og q sannsynligheten for at kolonne spiller A.", "game": "battle", "solution": ["Rene Nash: (A,A) og (B,B). Ingen vil alene bryte koordineringen i disse cellene.", "Rad er indifferent når 3q=2(1−q). Dette gir 5q=2 og q=0,4. Det er kolonnes sannsynlighet for A.", "Kolonne er indifferent når 2p=3(1−p). Dette gir 5p=3 og p=0,6. Det er rads sannsynlighet for A.", "Sjekk: Rad får 3·0,4=2·0,6=1,2. Kolonne får 2·0,6=3·0,4=1,2. Begge sannsynligheter er gyldige. Det finnes ingen andre strategier å kontrollere utenfor støtten i dette 2×2-spillet."]}, {"id": "w3", "title": "Nash er ikke det samme som felles beste", "topic": "g8", "level": "middels", "prompt": "Bruk «Fangens dilemma». Finn Nash-likevekten og sammenlign med gjensidig samarbeid. Hvorfor er utfallet med høyest sum ikke nødvendigvis stabilt?", "game": "prison", "solution": ["Avvik er strengt dominant for begge: Mot samarbeid får man 5 i stedet for 3. Mot avvik får man 1 i stedet for 0.", "Eneste Nash er (Avvik,Avvik) med (1,1). Gjensidig samarbeid gir (3,3) og Pareto-dominerer dette.", "Ved (Samarbeid,Samarbeid) kan hver enkelt øke fra 3 til 5 ved ensidig avvik. Derfor er ikke samarbeid en Nash-likevekt i engangsspillet."]}, {"id": "w4", "title": "Baklengs induksjon og en tom trussel", "topic": "g13", "level": "fordypning", "prompt": "Nykommer velger Inn eller Ute. Ute gir (0,4). Etter Inn velger den etablerte Hard, som gir (−1,1), eller Myk, som gir (2,2). Finn delspillperfekt likevekt. Forklar hvorfor (Ute,Hard) likevel er Nash i normalformen.", "game": "entry", "solution": ["Etter Inn sammenligner den etablerte sine egne gevinster 1 ved Hard og 2 ved Myk. Myk er optimal.", "Nykommer forutser Myk og velger Inn, som gir 2 fremfor 0 ved Ute. Delspillperfekt profil er (Inn,Myk).", "Gitt planen Hard foretrekker nykommer Ute: 0>−1. Gitt Ute påvirker ikke den etablertes plan gevinsten 4. Dermed er (Ute,Hard) Nash i normalformen, men ikke Nash i delspillet etter Inn, og derfor ikke delspillperfekt."]}, {"id": "w5", "title": "Grim trigger med ny gevinstmatrise", "topic": "g16", "level": "fordypning", "prompt": "Et uendelig gjentatt fangens dilemma har T=8, R=5, P=2 og S=0. Perfekt overvåking og grim trigger antas. Utled terskelen for δ og vurder δ=0,6.", "game": "", "solution": ["Samarbeid hver periode gir Vc=5/(1−δ). Ett avvik gir 8 nå og 2 i alle fremtidige perioder: Vd=8+2δ/(1−δ).", "Kravet Vc≥Vd gir 5≥8(1−δ)+2δ=8−6δ, altså δ≥3/6=0,5.", "Ved δ=0,6 er Vc=12,5 og Vd=8+1,2/0,4=11. Samarbeid er optimalt gitt grim trigger. Etter et avvik er gjensidig avvik troverdig fordi det er Nash i stadiespillet.", "Konklusjonen avhenger av uendelig/usikker horisont, observerbare avvik og de oppgitte strategiene. Ikke bruk terskelen som en generell lov for samarbeid."]}, {"id": "w6", "title": "Cournot fra profitt til kontroll", "topic": "g17", "level": "fordypning", "prompt": "To bedrifter velger mengder samtidig. P=120−2(q₁+q₂), MC=12 og ingen faste kostnader. Utled begge beste responser og finn mengder, pris og profitt i symmetrisk Nash.", "game": "", "solution": ["π₁=[120−2(q₁+q₂)−12]q₁=(108−2q₁−2q₂)q₁. Førsteordensbetingelsen er 108−4q₁−2q₂=0.", "BR₁=max{0,27−q₂/2}, og symmetrisk for bedrift 2. Ved q₁=q₂=q blir q=27−q/2, altså q=18.", "Q=36 og P=120−2·36=48. Profitt per bedrift er (48−12)·18=648.", "Andrederivert av egen profitt er −4, så den indre løsningen er et maksimum. Ved q₂=18 er beste respons q₁=18, og omvendt."]}, {"id": "w7", "title": "Cournot mot Stackelberg", "topic": "g19", "level": "fordypning", "prompt": "Bruk P=120−2(qL+qF) og MC=12. Lederen binder mengden først, følgeren observerer og velger etterpå. Finn mengder, pris og profitt. Sammenlign med Cournot fra forrige oppgave.", "game": "", "solution": ["Følgerens respons er qF=max{0,27−qL/2}. I det indre området setter lederen denne inn i egen profitt.", "πL=[108−2qL−2(27−qL/2)]qL=(54−qL)qL. Deriver: 54−2qL=0 gir qL=27. Da qF=13,5.", "Q=40,5 og P=120−81=39. πL=(39−12)·27=729, πF=(39−12)·13,5=364,5.", "Cournot ga hver 18 og profitt 648. Lederen vinner på forpliktelsen, følgeren taper. Dette er et resultat under de konkrete lineære standardforutsetningene."]}, {"id": "w8", "title": "Asymmetrisk nullsum og blanding", "topic": "g11", "level": "fordypning", "prompt": "Bruk «Et asymmetrisk nullsumspill». Finn hvorfor ingen rene likevekter finnes, og utled den blandede løsningen. La p=Pr(Øverst) og q=Pr(Venstre).", "game": "zero", "solution": ["Rads beste respons mot Venstre er Øverst (2>−2), og mot Høyre er Nederst (1>−1). Kolonne vil velge Høyre mot Øverst (1>−2) og Venstre mot Nederst (2>−1). Ingen celle er gjensidig beste respons.", "Rad får 2q−(1−q)=3q−1 ved Øverst og −2q+(1−q)=1−3q ved Nederst. Indifferens gir 6q=2, altså q=1/3.", "Kolonne får −2p+2(1−p)=2−4p ved Venstre og p−(1−p)=2p−1 ved Høyre. Indifferens gir 6p=3, altså p=1/2.", "Forventet gevinst til begge er 0. Det er galt å sette begge blandinger til 1/2 bare fordi spillet er nullsum; gevinstene bestemmer sannsynlighetene."]}, {"id": "w9", "title": "En avgift og hvem som betaler", "topic": "e3", "level": "middels", "prompt": "Qd=100−2Pk, Qs=10+Ps og Pk−Ps=6. Finn ny likevekt, fordeling av avgiftsbyrde, proveny og dødvektstap. Anta ingen eksternaliteter.", "game": "", "solution": ["Uten avgift er P=30 og Q=40. Med avgift: 100−2(Ps+6)=10+Ps, altså Ps=26, Pk=32, Q=36.", "Kjøperprisen øker 2, selgerprisen faller 4. Byrden per omsatt enhet er derfor 2 for kjøper og 4 for selger.", "Proveny=6·36=216. Ved lineære kurver er dødvektstapet ½·6·(40−36)=12.", "Dette er modellen uten markedssvikt. Ved en negativ eksternalitet kan en korrekt avgift gi en velferdsgevinst."]}, {"id": "w10", "title": "Reell vekst og prosentpoeng", "topic": "e8", "level": "middels", "prompt": "Nominelt BNP øker fra 1000 til 1080, og BNP-deflatoren øker fra 100 til 105. Finn reell vekst. Styringsrenten øker samtidig fra 4 til 5 prosent: skill prosent fra prosentpoeng.", "game": "", "solution": ["Nominell vekst er 1080/1000−1=8 %. Prisveksten er 105/100−1=5 %.", "Reell vekst er 1,08/1,05−1≈2,86 %. 8−5=3 % er bare en tilnærming.", "Renten øker 1 prosentpoeng. Den relative økningen er 1/4=25 %. Dette er to forskjellige beskrivelser av samme endring."]}, {"id": "w11", "title": "Vurder et makroøkonomisk sjokk", "topic": "e5", "level": "fordypning", "prompt": "Et importavhengig foretak møter dyrere energi, svakere krone og lavere ordreinngang. Drøft hvilke sjokk som kan ligge bak, og hvorfor én enkel AD–AS-forklaring ikke er nok.", "game": "", "solution": ["Dyrere energi kan være et negativt tilbudssjokk: høyere marginalkostnader, lavere produksjon og høyere prisnivå i standard kortsiktig modell med uendret AD.", "Svakere krone øker importkostnader målt i kroner og kan støtte eksportetterspørsel. Nettoeffekten avhenger av valuta i inntekter, kostnader, gjeld og eventuell sikring.", "Lavere ordreinngang kan også reflektere et negativt etterspørselssjokk. Flere sjokk samtidig kan trekke produksjon i samme retning, men prispress i ulike retninger.", "Drøft usikkerhet, tidshorisont, kapasitetsutnyttelse og pengepolitisk reaksjon. Det finnes ikke ett bestemt tallfasitsvar uten flere data."]}, {"id": "w12", "title": "Bygg en strategisk analyse av et teknologivalg", "topic": "g6", "level": "fordypning", "prompt": "To avdelinger velger hver sin teknologistandard. Samme standard gir interoperabilitet, mens ulike standarder gir integrasjonskostnader. Lag en 2×2-matrise med to rene Nash-likevekter og forklar hvordan koordineringen kan forbedres.", "game": "", "solution": ["Et mulig eksempel er (A,A)=(4,4), (A,B)=(0,0), (B,A)=(0,0), (B,B)=(2,2). Andre tall kan også være riktige hvis beste-respons-strukturen er den samme.", "Ved A fra motparten er A best, og ved B er B best. Dermed er begge diagonalene Nash. (A,A) Pareto-dominerer (B,B), men det alene garanterer ikke at A velges.", "En felles standardbeslutning, troverdig fremdriftsplan eller pilot som gjør forventningene samstemte kan redusere koordineringsproblemet. Begrunn antakelser om gevinster, byttekostnader og hvem som beslutter."]}]}</script></head><body><aside><a class="brand" href="#">s<span>l</span><small>STRATEGI & LEDELSE</small></a><div class="nav-label">DITT STUDIEROM</div><nav><button data-page="oversikt" class="active">◫ <span>Oversikt</span></button><button data-page="fagstoff">▤ <span>Kunnskapsbase</span></button><button data-page="quiz">✎ <span>Test deg selv</span></button><button data-page="spill">▦ <span>Spillverksted</span></button><button data-page="oppgaver">✎ <span>Åpne oppgaver</span></button><button data-page="kort">▱ <span>Flashkort</span></button><button data-page="modell">↗ <span>Økonomilab</span></button></nav><div class="aside-bottom"><span class="status-dot"></span> Litt hver dag. Mer forståelse.<small>Et selvstendig studieverktøy<br>Master i strategi og ledelse</small></div></aside><main><header><span>KUNNSKAP SOM BYGGER FORSTÅELSE</span><span class="student">SL <b>Ditt studierom</b></span></header><div id="app" aria-live="polite"><p>Laster kunnskapsbasen …</p></div><footer>STRATEGI & LEDELSE <span>Et øvingsverktøy for studier ved Nord universitet. Ikke offisielt pensum.</span></footer></main></body></html>
